x-app: &app
  build: .
  image: ai-buddy-backend-template:local
  networks: [private]
  environment: &environment
    DATABASE_URL: postgres://${POSTGRES_USER:-backend-template}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-backend-template}?sslmode=disable

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backend-template}
      POSTGRES_USER: ${POSTGRES_USER:-backend-template}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
  migrate:
    <<: *app
    command: [/app/migrate, up]
    depends_on:
      db:
        condition: service_healthy
  server:
    <<: *app
    environment:
      <<: *environment
      HTTP_ADDR: :8080
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?Set OIDC_REDIRECT_URI}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-24h}
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-1h}
    ports:
      - '${HTTP_BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8080}:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private, shared]
    restart: unless-stopped
  seed:
    <<: *app
    command: [/app/seed]
    profiles: [tools]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
networks:
  private:
  shared:
    external: true
    name: ai-buddy-shared
