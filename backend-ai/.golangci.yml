version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - nolintlint

    - revive
    - gocritic
    - modernize
    - wsl_v5
    - whitespace
    - misspell
    - godot
    - nakedret
    - predeclared
    - dogsled
    - unconvert
    - unparam
    - goconst
    - perfsprint
    - intrange
    - usestdlibvars
    - errorlint
    - errname
    - nilerr
    - nilnil
    - makezero
    - wastedassign
    - gocognit
    - nestif
    - dupword
    - noctx

  exclusions:
    presets: []
    rules:
      # Fixture literals and complete integration scenarios belong together.
      - path: _test\.go
        linters:
          - goconst
          - gocognit
          - nestif

  settings:
    govet:
      enable-all: true
      disable:
        # Field order affects JSON output; idiomatic error scopes may shadow.
        - fieldalignment
        - shadow

    staticcheck:
      checks:
        - all

    nolintlint:
      require-explanation: true
      require-specific: true

    errcheck:
      check-type-assertions: true
      check-blank: true

    gocritic:
      settings:
        hugeParam:
          sizeThreshold: 256
        rangeValCopy:
          sizeThreshold: 256
      enabled-tags:
        - diagnostic
        - performance
        - style
        - opinionated

    revive:
      severity: error
      enable-all-rules: true
      rules:
        # Internal domains contain several models; they are not public Go libraries.
        - name: enforce-switch-style
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: unexported-return
          disabled: true
        - name: exported
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: nested-structs
          disabled: true
        # goconst finds repeated strings without turning 0, 1 and "" into constants.
        - name: add-constant
          disabled: true
        # gocognit and nestif cover control-flow complexity.
        - name: max-control-nesting
          disabled: true
        - name: package-comments
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: function-length
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true

    wsl_v5:
      allow-first-in-block: false
      allow-whole-block: false
      branch-max-lines: 2

    gocognit:
      min-complexity: 25

    nestif:
      min-complexity: 4

    nakedret:
      max-func-lines: 1

    goconst:
      min-occurrences: 3

formatters:
  enable:
    - gofumpt
    - goimports
    - golines

  settings:
    golines:
      max-len: 100
      tab-len: 8
      shorten-comments: false
