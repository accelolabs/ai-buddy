name: backend-wiki

x-app: &app
  build:
    context: ../..
    args:
      SERVICE: wiki
  image: ai-buddy-backend-wiki:local
  networks: [private]
  environment: &environment
    DATABASE_URL: postgres://${POSTGRES_USER:-backend-wiki}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@backend-wiki-db:5432/${POSTGRES_DB:-backend-wiki}?sslmode=disable

services:
  backend-wiki-db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backend-wiki}
      POSTGRES_USER: ${POSTGRES_USER:-backend-wiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - backend-wiki-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
  migrate:
    <<: *app
    command: [/app/migrate, wiki, up]
    depends_on:
      backend-wiki-db:
        condition: service_healthy
  backend-wiki:
    <<: *app
    environment:
      <<: *environment
      HTTP_ADDR: :8080
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
      OIDC_CLIENT_ID: wiki
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?Set OIDC_REDIRECT_URI}
      BUDDY_API_KEY: ${BUDDY_API_KEY:?Set BUDDY_API_KEY}
      AUTHENTIK_URL: ${AUTHENTIK_URL:?Set AUTHENTIK_URL}
      AUTHENTIK_READ_TOKEN: ${AUTHENTIK_READ_TOKEN:?Set AUTHENTIK_READ_TOKEN}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      WIKI_MIN_SIMILARITY: ${WIKI_MIN_SIMILARITY:-0.35}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-24h}
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-1h}
    ports:
      - '${HTTP_BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8082}:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private, shared]
    restart: unless-stopped
  index:
    <<: *app
    command: [/app/wiki-index]
    environment:
      <<: *environment
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      KNOWLEDGE_BASE_DIR: /knowledge-base
    profiles: [tools]
    volumes:
      - type: bind
        source: ${KNOWLEDGE_BASE_DIR:-../../../knowledge-base}
        target: /knowledge-base
        read_only: true
        bind:
          create_host_path: false
    networks: [private, shared]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  backend-wiki-data:
networks:
  private:
    internal: true
  shared:
    external: true
    name: ai-buddy-shared
