# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: AI Buddy - OIDC
entries:
  # File discovery has no guaranteed ordering. Apply built-in dependencies first.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: system/providers-oauth2.yaml
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-authentication-flow.yaml
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-authorization-implicit-consent.yaml
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-invalidation.yaml
      required: true

  - model: authentik_providers_oauth2.scopemapping
    id: ai-buddy-scope
    state: present
    identifiers:
      name: AI Buddy - Identity
    attrs:
      scope_name: ai_buddy
      description: User identity, role and team for AI Buddy services
      expression: |
        return {
            "authentik_id": str(request.user.pk),
            "role": request.user.attributes.get("role"),
            "team": request.user.attributes.get("team"),
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: buddy-provider
    state: present
    identifiers:
      name: AI Buddy - Buddy
    attrs:
      client_id: buddy
      client_secret: !Env BUDDY_CLIENT_SECRET
      client_type: confidential
      grant_types: [authorization_code]
      issuer_mode: per_provider
      include_claims_in_id_token: true
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !KeyOf ai-buddy-scope
      redirect_uris:
        - matching_mode: strict
          url: !Format ['%s/api/auth/callback', !Env BUDDY_PUBLIC_URL]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: buddy
    attrs:
      name: Buddy
      provider: !KeyOf buddy-provider
      meta_launch_url: !Env BUDDY_PUBLIC_URL

  - model: authentik_providers_oauth2.oauth2provider
    id: wiki-provider
    state: present
    identifiers:
      name: AI Buddy - Wiki
    attrs:
      client_id: wiki
      client_secret: !Env WIKI_CLIENT_SECRET
      client_type: confidential
      grant_types: [authorization_code]
      issuer_mode: per_provider
      include_claims_in_id_token: true
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !KeyOf ai-buddy-scope
      redirect_uris:
        - matching_mode: strict
          url: !Format ['%s/api/auth/callback', !Env WIKI_PUBLIC_URL]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: wiki
    attrs:
      name: Wiki
      provider: !KeyOf wiki-provider
      meta_launch_url: !Env WIKI_PUBLIC_URL

  - model: authentik_providers_oauth2.oauth2provider
    id: tracker-provider
    state: present
    identifiers:
      name: AI Buddy - Tracker
    attrs:
      client_id: tracker
      client_secret: !Env TRACKER_CLIENT_SECRET
      client_type: confidential
      grant_types: [authorization_code]
      issuer_mode: per_provider
      include_claims_in_id_token: true
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !KeyOf ai-buddy-scope
      redirect_uris:
        - matching_mode: strict
          url: !Format ['%s/api/auth/callback', !Env TRACKER_PUBLIC_URL]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: tracker
    attrs:
      name: Tracker
      provider: !KeyOf tracker-provider
      meta_launch_url: !Env TRACKER_PUBLIC_URL

  - model: authentik_providers_oauth2.oauth2provider
    id: ticket-provider
    state: present
    identifiers:
      name: AI Buddy - Ticket
    attrs:
      client_id: ticket
      client_secret: !Env TICKET_CLIENT_SECRET
      client_type: confidential
      grant_types: [authorization_code]
      issuer_mode: per_provider
      include_claims_in_id_token: true
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !KeyOf ai-buddy-scope
      redirect_uris:
        - matching_mode: strict
          url: !Format ['%s/api/auth/callback', !Env TICKET_PUBLIC_URL]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: ticket
    attrs:
      name: Ticket
      provider: !KeyOf ticket-provider
      meta_launch_url: !Env TICKET_PUBLIC_URL
