name: backend-tracker

x-app: &app
  build:
    context: ../..
    args:
      SERVICE: tracker
  image: ai-buddy-backend-tracker:local
  networks: [private]
  environment: &environment
    DATABASE_URL: postgres://${POSTGRES_USER:-backend-tracker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@backend-tracker-db:5432/${POSTGRES_DB:-backend-tracker}?sslmode=disable

services:
  backend-tracker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backend-tracker}
      POSTGRES_USER: ${POSTGRES_USER:-backend-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - backend-tracker-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
  migrate:
    <<: *app
    command: [/app/migrate, tracker, up]
    depends_on:
      backend-tracker-db:
        condition: service_healthy
  backend-tracker:
    <<: *app
    environment:
      <<: *environment
      HTTP_ADDR: :8080
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
      OIDC_CLIENT_ID: tracker
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?Set OIDC_REDIRECT_URI}
      BUDDY_API_KEY: ${BUDDY_API_KEY:?Set BUDDY_API_KEY}
      TICKET_API_KEY: ${TICKET_API_KEY:?Set TICKET_API_KEY}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-24h}
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-1h}
    ports:
      - '${HTTP_BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8083}:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private, shared]
    restart: unless-stopped
  seed:
    <<: *app
    command: [/app/seed, tracker]
    environment:
      <<: *environment
      AUTHENTIK_URL: ${AUTHENTIK_URL:-}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:-}
    profiles: [tools]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  backend-tracker-data:
networks:
  private:
  shared:
    external: true
    name: ai-buddy-shared
