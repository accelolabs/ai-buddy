name: ai-buddy-ollama

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    command: [serve]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: '4096'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '2'
    volumes:
      - models:/root/.ollama
    ports:
      - '127.0.0.1:${OLLAMA_HTTP_PORT:-11434}:11434'
    networks: [shared]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20

  models:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    entrypoint: [/bin/sh]
    command:
      - -ec
      - |
        ollama pull "$$EMBEDDING_MODEL"
        ollama pull "$$CHAT_MODEL"
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma:300m}
      CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3.5:4b}
    depends_on:
      ollama:
        condition: service_healthy
    networks: [shared]
    restart: 'no'

volumes:
  models:

networks:
  shared:
    external: true
    name: ai-buddy-shared
