openapi: 3.1.1
info:
  title: Buddy API
  version: 1.0.0
  description: >-
    Browser POST requests reject cross-origin requests using Sec-Fetch-Site and Origin (HTTP 403).
    Sessions use a Secure, HttpOnly, SameSite=Lax __Host-session cookie scoped to this service.
    JSON request bodies reject unknown fields and trailing JSON; maximum body size is 1 MiB.
    Internal routes accept only the documented Bearer service keys. Ownership and team identity
    come from the session or trusted internal path, never JSON. Known JSON field names are matched
    case-insensitively; duplicate fields use the last value. Content-Type is not enforced. Internal
    callers are trusted to select path user IDs; owner predicates limit data to that selected
    identity. GET also accepts HEAD. Unsupported auth methods return text/plain 405. Unsupported
    health methods fall through to the domain handler (rather than ServeMux 405): Tracker returns
    text/plain 404, Ticket and Wiki return JSON 404, and Buddy applies session/role checks before
    JSON 404. Domain fallbacks return JSON 404/405 after their outer middleware.
servers:
  - url: https://{host}
    description: Public HTTPS
    variables:
      host: {default: buddy.example.com}
  - {url: 'http://localhost:8081', description: Local Compose}
security:
  - {Session: []}
paths:
  /health/live:
    get:
      operationId: buddy_get_health_live
      summary: Process liveness
      description: Public endpoint.
      security: []
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
  /health/ready:
    get:
      operationId: buddy_get_health_ready
      summary: Database readiness
      description: Public endpoint.
      security: []
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '503':
          description: Database unavailable
          content:
            text/plain:
              schema: {type: string}
              example: "database unavailable\n"
  /api/auth/login:
    get:
      operationId: buddy_get_api_auth_login
      summary: OIDC login
      description: >-
        OIDC authorization code flow with state, nonce and PKCE. Login state expires in five
        minutes. Callback is single-use; successful callback renews the session and redirects to /.
        Login redirects to the configured provider. Session cookie never appears in response JSON.
      security: []
      responses:
        '302': {$ref: '#/components/responses/AuthRedirect'}
        '500': {$ref: '#/components/responses/SessionUnavailable'}
        '405': {$ref: '#/components/responses/AuthMethodNotAllowed'}
  /api/auth/callback:
    get:
      operationId: buddy_get_api_auth_callback
      summary: OIDC callback
      description: >-
        OIDC authorization code flow with state, nonce and PKCE. Login state expires in five
        minutes. Callback is single-use; successful callback renews the session and redirects to /.
        Login redirects to the configured provider. Session cookie never appears in response JSON.
      security: []
      responses:
        '302': {$ref: '#/components/responses/AuthRedirect'}
        '500': {$ref: '#/components/responses/SessionUnavailable'}
        '400':
          description: Invalid/expired callback or failed authentication
          content:
            text/plain:
              schema: {type: string}
              example: "invalid login\n"
        '405': {$ref: '#/components/responses/AuthMethodNotAllowed'}
      parameters:
        - name: code
          in: query
          required: false
          description: code
          schema: {type: string}
        - name: state
          in: query
          required: false
          description: state
          schema: {type: string}
        - name: error
          in: query
          required: false
          description: error
          schema: {type: string}
  /api/auth/me:
    get:
      operationId: buddy_get_api_auth_me
      summary: Current user
      description: >-
        Authenticated intern or mentor session. Access to another owner or team is rejected; no
        data are disclosed.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/401'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/AuthMethodNotAllowed'}
  /api/auth/logout:
    post:
      operationId: buddy_post_api_auth_logout
      summary: Destroy this service session
      description: >-
        Same-origin browser POST; also succeeds when already logged out. Destroy only this service
        session.
      security: []
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '403': {$ref: '#/components/responses/403'}
        '500': {$ref: '#/components/responses/SessionUnavailable'}
        '405': {$ref: '#/components/responses/AuthMethodNotAllowed'}
  /api/chats:
    post:
      operationId: buddy_post_api_chats
      summary: chats post
      description: >-
        Authenticated intern session. Access to another owner or team is rejected; no data are
        disclosed.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Chat'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/405'}
    get:
      operationId: buddy_get_api_chats
      summary: chats get
      description: >-
        Authenticated intern session. Access to another owner or team is rejected; no data are
        disclosed.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  chats:
                    type: array
                    items: {$ref: '#/components/schemas/Chat'}
                required: [chats]
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/405'}
  /api/chats/{id}:
    get:
      operationId: buddy_get_api_chats_id
      summary: '{id} get'
      description: >-
        Authenticated intern session. Access to another owner or team is rejected; no data are
        disclosed.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/History'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '404': {$ref: '#/components/responses/404'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/405'}
      parameters:
        - {$ref: '#/components/parameters/ID'}
  /api/chats/{id}/messages:
    post:
      operationId: buddy_post_api_chats_id_messages
      summary: messages post
      description: >-
        Authenticated intern session. Access to another owner or team is rejected; no data are
        disclosed. Content must contain non-whitespace. Same key and identical original content
        returns the same run (202); changed content or another active run yields 409. Disconnecting
        does not stop generation.
      responses:
        '202': {$ref: '#/components/responses/Run'}
        '400': {$ref: '#/components/responses/400'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '404': {$ref: '#/components/responses/404'}
        '409': {$ref: '#/components/responses/409'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/405'}
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Non-whitespace key, at most 200 UTF-8 bytes. Preserved verbatim; maxLength is only a
            character upper bound.
          schema:
            type: string
            minLength: 1
            maxLength: 200
            description: Non-whitespace; scoped to chat.
            x-maxBytes: 200
      requestBody:
        required: true
        description: JSON, at most 1 MiB. Unknown fields rejected.
        content:
          application/json:
            schema:
              type: object
              properties:
                content: {type: string, minLength: 1, maxLength: 2000}
              required: [content]
              additionalProperties: false
              example: {content: Help me find the onboarding guide}
  /api/runs/{id}/retry:
    post:
      operationId: buddy_post_api_runs_id_retry
      summary: retry post
      description: >-
        Authenticated intern session. Access to another owner or team is rejected; no data are
        disclosed. Only error runs can be retried. The original message is reused. Repeated retry
        of the same original error returns one new run. Another active run causes 409. No automatic
        retry after restart.
      responses:
        '202': {$ref: '#/components/responses/Run'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '404': {$ref: '#/components/responses/404'}
        '409': {$ref: '#/components/responses/409'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/405'}
      parameters:
        - {$ref: '#/components/parameters/ID'}
  /api/actions/{id}/confirm:
    post:
      operationId: buddy_post_api_actions_id_confirm
      summary: confirm post
      description: >-
        Authenticated intern session. Access to another owner or team is rejected; no data are
        disclosed.
      responses:
        '200': {$ref: '#/components/responses/Action'}
        '400': {$ref: '#/components/responses/400'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '404': {$ref: '#/components/responses/404'}
        '409': {$ref: '#/components/responses/409'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/405'}
      parameters:
        - {$ref: '#/components/parameters/ID'}
      requestBody:
        required: true
        description: >-
          Required JSON body. Both {} and top-level null reuse stored fields; omitted or null
          fields also reuse them.
        content:
          application/json:
            schema:
              type: [object, 'null']
              properties:
                fields:
                  anyOf:
                    - {$ref: '#/components/schemas/Fields'}
                    - {type: 'null'}
              required: []
              additionalProperties: false
              example: {}
  /api/actions/{id}/cancel:
    post:
      operationId: buddy_post_api_actions_id_cancel
      summary: cancel post
      description: >-
        Authenticated intern session. Access to another owner or team is rejected; no data are
        disclosed.
      responses:
        '200': {$ref: '#/components/responses/Action'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '404': {$ref: '#/components/responses/404'}
        '409': {$ref: '#/components/responses/409'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/405'}
      parameters:
        - {$ref: '#/components/parameters/ID'}
  /api/runs/{id}/events:
    get:
      operationId: buddy_get_api_runs_id_events
      summary: Replay and follow persisted run events
      description: >-
        Authenticated intern session. Access to another owner or team is rejected; no data are
        disclosed. Each frame has an integer id (per-run sequence), event name and one JSON data
        value. Every 15 seconds of inactivity a comment : heartbeat is sent without an id. Client
        disconnect does not cancel the run. Reconnect with Last-Event-ID for replay, including
        partial text and terminal events; duplicate IDs should be ignored. After restart
        queued/running runs terminate with error and require manual retry. Comment heartbeats are
        periodic, have no ID, and do not advance the replay cursor. Payloads are validated per
        event, not as a JSON stream.
      responses:
        '200':
          description: SSE stream; closes after terminal event. Late subscribers replay stored events.
          content:
            text/event-stream:
              schema: {type: string}
              examples:
                stream:
                  value: |+
                    : heartbeat

                    id: 1
                    event: stage
                    data: "answering"

                    id: 2
                    event: text
                    data: "Hello"

                    id: 3
                    event: usage
                    data: {"prompt_eval_count":128,"num_ctx":4096}

                    id: 4
                    event: done
                    data: {"status":"done","error":""}

                source:
                  value: |+
                    id: 5
                    event: source
                    data: {"document_id":"guide","document_title":"Guide","section_title":"Setup","text":"Excerpt","url":"https://wiki.example.invalid/api/documents/guide"}

                action:
                  value: |+
                    id: 6
                    event: action
                    data: {"id":"action","kind":"create_task","status":"draft","fields":{"title":"Read guide","description":"","deadline":"2026-12-01"}}

                result:
                  value: |+
                    id: 7
                    event: result
                    data: {"id": "task", "intern_id": "intern", "title": "Read guide", "description": "Setup", "deadline": "2026-12-01", "created_at": "2026-11-14T12:00:00Z", "completed_at": "2026-11-14T12:05:00Z", "status": "completed", "overdue": false}

                error:
                  value: |+
                    id: 8
                    event: error
                    data: {"status":"error","error":"service restarted; retry manually"}

          headers:
            Cache-Control:
              schema: {type: string, enum: [no-cache]}
            X-Accel-Buffering:
              schema: {type: string, enum: ['no']}
        '400': {$ref: '#/components/responses/400'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '404': {$ref: '#/components/responses/404'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/405'}
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - name: Last-Event-ID
          in: header
          required: false
          description: >-
            Nonnegative signed int64 parsed in base 10; +1 and -0 are accepted. Replay strictly
            after this per-run sequence ID; overflow is rejected.
          schema: {type: string, pattern: '^([+]?[0-9]+|-0+)$', description: Nonnegative signed int64 decimal.}
      x-event-payloads:
        stage: {$ref: '#/components/schemas/StageEvent'}
        text: {$ref: '#/components/schemas/TextEvent'}
        source: {$ref: '#/components/schemas/SourceEvent'}
        action: {$ref: '#/components/schemas/ActionEvent'}
        result: {$ref: '#/components/schemas/ResultEvent'}
        usage: {$ref: '#/components/schemas/UsageEvent'}
        done: {$ref: '#/components/schemas/DoneEvent'}
        error: {$ref: '#/components/schemas/ErrorEvent'}
components:
  securitySchemes:
    Session: {type: apiKey, in: cookie, name: __Host-session}
  schemas:
    Error:
      type: object
      properties:
        error: {type: string}
      required: [error]
      example: {error: invalid input}
      additionalProperties: false
    User:
      type: object
      properties:
        authentik_id: {type: string}
        role: {type: string}
        team: {type: string}
        name: {type: string}
        email: {type: string}
        preferred_username: {type: string}
      required: [authentik_id, role, team, name, email, preferred_username]
      additionalProperties: false
    Chat:
      type: object
      properties:
        id: {type: string}
        title: {type: string, maxLength: 80}
        created_at: {type: string, format: date-time}
      required: [id, title, created_at]
      additionalProperties: false
    Run:
      type: object
      properties:
        id: {type: string}
        chat_id: {type: string}
        status: {type: string, enum: [queued, running, done, error]}
        error: {type: string}
        events_url: {type: string}
      required: [id, chat_id, status, error, events_url]
      description: >-
        One active run per chat. Errors require manual retry. An interrupted response remains in
        history.
      additionalProperties: false
    TaskFields:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Must contain non-whitespace text. Length bounds count the submitted Unicode characters.
        description: {type: [string, 'null'], maxLength: 10000, description: Null or omission decodes to an empty string.}
        deadline: {type: string, format: date}
      required: [title, deadline]
      additionalProperties: false
    TicketFields:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 200
          description: Must contain non-whitespace text. Length bounds count the submitted Unicode characters.
        description:
          type: string
          minLength: 1
          maxLength: 10000
          description: Must contain non-whitespace text. Length bounds count the submitted Unicode characters.
      required: [question, description]
      additionalProperties: false
    Fields:
      oneOf:
        - {$ref: '#/components/schemas/TaskFields'}
        - {$ref: '#/components/schemas/TicketFields'}
    Action:
      type: object
      properties:
        id: {type: string}
        run_id: {type: string}
        kind: {type: string, enum: [create_task, create_ticket]}
        status: {type: string, enum: [draft, executing, done, error, cancelled]}
        fields: {$ref: '#/components/schemas/Fields'}
        result:
          anyOf:
            - {$ref: '#/components/schemas/TaskResult'}
            - {$ref: '#/components/schemas/TicketResult'}
            - {type: 'null'}
        error: {type: string}
      required: [id, run_id, kind, status, fields, result, error]
      description: >-
        Confirm freezes fields atomically and uses buddy-action:{id} downstream forever.
        Executing/cancelled actions conflict. A done action is returned without another write.
        Retry an error manually with the same fields (or omit them). Cancel only a draft; repeated
        cancel succeeds. Result is null until a downstream result is saved. An HTTP 200 action may
        have status error: inspect status and error. Frozen fields retain the submitted JSON
        representation, including a null task description; downstream decoding treats it as an
        empty string.
      additionalProperties: false
    Message:
      type: object
      properties:
        id: {type: string}
        run_id: {type: string}
        role: {type: string, enum: [user, assistant]}
        content: {type: string}
        created_at: {type: string, format: date-time}
      required: [id, run_id, role, content, created_at]
      additionalProperties: false
    Card:
      type: object
      properties:
        run_id: {type: string}
        kind: {type: string, enum: [source, result]}
        data: {type: object}
      required: [run_id, kind, data]
      additionalProperties: false
    History:
      type: object
      properties:
        chat: {$ref: '#/components/schemas/Chat'}
        messages:
          type: array
          items: {$ref: '#/components/schemas/Message'}
        runs:
          type: array
          items: {$ref: '#/components/schemas/Run'}
        latest_run:
          anyOf:
            - {$ref: '#/components/schemas/Run'}
            - {type: 'null'}
        actions:
          type: array
          items: {$ref: '#/components/schemas/Action'}
        cards:
          type: array
          items: {$ref: '#/components/schemas/Card'}
      required: [chat, messages, runs, latest_run, actions, cards]
      description: All collections use [], never null. latest_run is null for an empty chat.
      additionalProperties: false
    StageEvent:
      type: string
      description: waiting_for_model, choosing_tools, answering, or the tool name.
      example: answering
    TextEvent:
      type: string
      description: Incremental text, committed to the assistant message before transmission.
      example: Hello
    SourceEvent:
      type: object
      properties:
        document_id: {type: string}
        document_title: {type: string}
        section_title: {type: string}
        text: {type: string}
        url: {type: string}
      required: [document_id, document_title, section_title, text, url]
    ActionEvent:
      type: object
      properties:
        id: {type: string}
        kind: {type: string, enum: [create_task, create_ticket]}
        status: {type: string, enum: [draft]}
        fields: {$ref: '#/components/schemas/Fields'}
      required: [id, kind, status, fields]
    ResultEvent: {$ref: '#/components/schemas/TaskResult'}
    UsageEvent:
      type: object
      properties:
        prompt_eval_count: {type: integer}
        num_ctx: {type: integer, const: 4096}
      required: [prompt_eval_count, num_ctx]
    DoneEvent:
      type: object
      properties:
        status: {type: string, enum: [done]}
        error: {type: string, enum: ['']}
      required: [status, error]
    ErrorEvent:
      type: object
      properties:
        status: {type: string, enum: [error]}
        error: {type: string}
      required: [status, error]
    TaskResult:
      type: object
      properties:
        id: {type: string}
        intern_id: {type: string}
        title: {type: string}
        description: {type: string}
        deadline: {type: string, format: date}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        status: {type: string, enum: [pending, completed]}
        overdue: {type: boolean}
      required: [id, intern_id, title, description, deadline, created_at, completed_at, status, overdue]
      description: >-
        Overdue means incomplete with deadline earlier than the current APP_TIMEZONE calendar date.
        Completed tasks always have overdue=false. Dates are YYYY-MM-DD; timestamps include a
        timezone.
      example:
        id: task
        intern_id: intern
        title: Read guide
        description: Setup
        deadline: '2026-12-01'
        created_at: '2026-11-14T12:00:00Z'
        completed_at: '2026-11-14T12:05:00Z'
        status: completed
        overdue: false
      additionalProperties: false
    TicketResult:
      type: object
      properties:
        id: {type: string}
        sender_id: {type: string}
        recipient_id: {type: string}
        question: {type: string}
        description: {type: string}
        created_at: {type: string, format: date-time}
      required: [id, sender_id, recipient_id, question, description, created_at]
      additionalProperties: false
  responses:
    '400':
      description: Invalid input
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    '401':
      description: >-
        Missing session or missing, malformed or invalid service key. A corrupt stored session
        identity returns 500.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    '403':
      description: Role, service key or cross-origin request forbidden
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    '404':
      description: Resource absent or outside owner/team scope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    '405':
      description: >-
        Unsupported method at a known domain path; outer authentication/session policy still
        applies. Allow lists explicit registered methods, without implicit HEAD.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
      headers:
        Allow:
          schema: {type: string}
          description: >-
            Explicit registered methods, comma-space separated; GET also accepts HEAD even when
            HEAD is absent here.
    '409':
      description: Idempotency or state conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    '500':
      description: Storage or session unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NoContent: {description: Success; no response body}
    AuthRedirect:
      description: Redirect to the OIDC provider or /. May include an HTML redirect body.
      headers:
        Location:
          description: Configured OIDC authorization URL or /
          schema: {type: string}
      content:
        text/html:
          schema: {type: string}
    SessionUnavailable:
      description: Session unavailable
      content:
        text/plain:
          schema: {type: string}
          example: "session unavailable\n"
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthMethodNotAllowed:
      description: Unsupported method (ServeMux); GET also accepts HEAD.
      headers:
        Allow:
          schema: {type: string}
      content:
        text/plain:
          schema: {type: string}
    Run:
      description: Success
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Run'}
    Action:
      description: Success
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Action'}
  parameters:
    ID:
      name: id
      in: path
      required: true
      description: id
      schema: {type: string, minLength: 1}
