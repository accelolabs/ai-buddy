openapi: 3.1.1
info:
  title: Wiki API
  version: 1.0.0
  description: >-
    Browser POST requests reject cross-origin requests using Sec-Fetch-Site and Origin (HTTP 403).
    Sessions use a Secure, HttpOnly, SameSite=Lax __Host-session cookie scoped to this service.
    JSON request bodies reject unknown fields and trailing JSON; maximum body size is 1 MiB.
    Internal routes accept only the documented Bearer service keys. Ownership and team identity
    come from the session or trusted internal path, never JSON. Known JSON field names are matched
    case-insensitively; duplicate fields use the last value. Content-Type is not enforced. Internal
    callers are trusted to select path user IDs; owner predicates limit data to that selected
    identity. GET also accepts HEAD. Unsupported auth methods return text/plain 405. Unsupported
    health methods fall through to the domain handler (rather than ServeMux 405): Tracker returns
    text/plain 404, Ticket and Wiki return JSON 404, and Buddy applies session/role checks before
    JSON 404. Domain fallbacks return JSON 404/405 after their outer middleware.
servers:
  - url: https://{host}
    description: Public HTTPS
    variables:
      host: {default: wiki.example.com}
  - {url: 'http://localhost:8082', description: Local Compose}
security:
  - {Session: []}
paths:
  /health/live:
    get:
      operationId: wiki_get_health_live
      summary: Process liveness
      description: Public endpoint.
      security: []
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
  /health/ready:
    get:
      operationId: wiki_get_health_ready
      summary: Database readiness
      description: Public endpoint.
      security: []
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '503':
          description: Database unavailable
          content:
            text/plain:
              schema: {type: string}
              example: "database unavailable\n"
  /api/auth/login:
    get:
      operationId: wiki_get_api_auth_login
      summary: OIDC login
      description: >-
        OIDC authorization code flow with state, nonce and PKCE. Login state expires in five
        minutes. Callback is single-use; successful callback renews the session and redirects to /.
        Login redirects to the configured provider. Session cookie never appears in response JSON.
      security: []
      responses:
        '302': {$ref: '#/components/responses/AuthRedirect'}
        '500': {$ref: '#/components/responses/SessionUnavailable'}
        '405': {$ref: '#/components/responses/AuthMethodNotAllowed'}
  /api/auth/callback:
    get:
      operationId: wiki_get_api_auth_callback
      summary: OIDC callback
      description: >-
        OIDC authorization code flow with state, nonce and PKCE. Login state expires in five
        minutes. Callback is single-use; successful callback renews the session and redirects to /.
        Login redirects to the configured provider. Session cookie never appears in response JSON.
      security: []
      responses:
        '302': {$ref: '#/components/responses/AuthRedirect'}
        '500': {$ref: '#/components/responses/SessionUnavailable'}
        '400':
          description: Invalid/expired callback or failed authentication
          content:
            text/plain:
              schema: {type: string}
              example: "invalid login\n"
        '405': {$ref: '#/components/responses/AuthMethodNotAllowed'}
      parameters:
        - name: code
          in: query
          required: false
          description: code
          schema: {type: string}
        - name: state
          in: query
          required: false
          description: state
          schema: {type: string}
        - name: error
          in: query
          required: false
          description: error
          schema: {type: string}
  /api/auth/me:
    get:
      operationId: wiki_get_api_auth_me
      summary: Current user
      description: >-
        Authenticated intern or mentor session. Access to another owner or team is rejected; no
        data are disclosed.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/401'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/AuthMethodNotAllowed'}
  /api/auth/logout:
    post:
      operationId: wiki_post_api_auth_logout
      summary: Destroy this service session
      description: >-
        Same-origin browser POST; also succeeds when already logged out. Destroy only this service
        session.
      security: []
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '403': {$ref: '#/components/responses/403'}
        '500': {$ref: '#/components/responses/SessionUnavailable'}
        '405': {$ref: '#/components/responses/AuthMethodNotAllowed'}
  /api/documents:
    get:
      operationId: wiki_get_api_documents
      summary: Read team documentation
      description: >-
        Authenticated intern or mentor session. Access to another owner or team is rejected; no
        data are disclosed. Only common and current team documents are visible. Empty results are
        []. URLs are relative /api/documents/{id}; markdown is returned as source text. Internal
        search resolves team through Authentik, does not trust a team parameter.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Metadata'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '500': {$ref: '#/components/responses/500'}
        '503': {$ref: '#/components/responses/503'}
        '405': {$ref: '#/components/responses/405'}
  /api/documents/{id}:
    get:
      operationId: wiki_get_api_documents_id
      summary: Read team documentation
      description: >-
        Authenticated intern or mentor session. Access to another owner or team is rejected; no
        data are disclosed. Only common and current team documents are visible. Empty results are
        []. URLs are relative /api/documents/{id}; markdown is returned as source text. Internal
        search resolves team through Authentik, does not trust a team parameter.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '404': {$ref: '#/components/responses/404'}
        '500': {$ref: '#/components/responses/500'}
        '503': {$ref: '#/components/responses/503'}
        '405': {$ref: '#/components/responses/405'}
      parameters:
        - {$ref: '#/components/parameters/ID'}
  /api/search:
    post:
      operationId: wiki_post_api_search
      summary: Search team documentation
      description: >-
        Authenticated intern or mentor session. Access to another owner or team is rejected; no
        data are disclosed. Only common and current team documents are visible. Empty results are
        []. URLs are relative /api/documents/{id}; markdown is returned as source text. Internal
        search resolves team through Authentik, does not trust a team parameter.
      responses:
        '200': {$ref: '#/components/responses/SearchResults'}
        '400': {$ref: '#/components/responses/400'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '500': {$ref: '#/components/responses/500'}
        '503': {$ref: '#/components/responses/503'}
        '405': {$ref: '#/components/responses/405'}
      requestBody: {$ref: '#/components/requestBodies/Query'}
  /internal/users/{id}/search:
    post:
      operationId: wiki_post_internal_users_id_search
      summary: Search team documentation
      description: >-
        Internal: Bearer Buddy key; path identifies the user. The trusted service caller selects
        the path user ID; data are filtered to that owner. No independent end-user/team comparison
        is performed. Only common and current team documents are visible. Empty results are [].
        URLs are relative /api/documents/{id}; markdown is returned as source text. Internal search
        resolves team through Authentik, does not trust a team parameter.
      security:
        - {ServiceKey: []}
      responses:
        '200': {$ref: '#/components/responses/SearchResults'}
        '400': {$ref: '#/components/responses/400'}
        '401': {$ref: '#/components/responses/401'}
        '404': {$ref: '#/components/responses/404'}
        '503': {$ref: '#/components/responses/503'}
        '405': {$ref: '#/components/responses/405'}
      parameters:
        - {$ref: '#/components/parameters/ID'}
      requestBody: {$ref: '#/components/requestBodies/Query'}
components:
  securitySchemes:
    Session: {type: apiKey, in: cookie, name: __Host-session}
    ServiceKey:
      type: http
      scheme: bearer
      description: Buddy service API key; trusted caller selects the path user ID.
  schemas:
    Error:
      type: object
      properties:
        error: {type: string}
      required: [error]
      example: {error: invalid input}
      additionalProperties: false
    User:
      type: object
      properties:
        authentik_id: {type: string}
        role: {type: string}
        team: {type: string}
        name: {type: string}
        email: {type: string}
        preferred_username: {type: string}
      required: [authentik_id, role, team, name, email, preferred_username]
      additionalProperties: false
    Metadata:
      type: object
      properties:
        id: {type: string}
        path: {type: string}
        title: {type: string}
        url: {type: string}
      required: [id, path, title, url]
      example:
        id: document
        path: common/guide.md
        title: Guide
        url: /api/documents/document
      additionalProperties: false
    Document:
      type: object
      properties:
        id: {type: string}
        path: {type: string}
        title: {type: string}
        url: {type: string}
        markdown: {type: string}
      required: [id, path, title, url, markdown]
      additionalProperties: false
    Source:
      type: object
      properties:
        document_id: {type: string}
        document_title: {type: string}
        section_title: {type: string}
        anchor: {type: string}
        text: {type: string}
        url: {type: string}
      required: [document_id, document_title, section_title, anchor, text, url]
      additionalProperties: false
    Query:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4000
          description: Trimmed; whitespace-only is invalid.
      required: [query]
      additionalProperties: false
      example: {query: 'How do I set up my workspace?'}
  responses:
    '400':
      description: Invalid input
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    '401':
      description: >-
        Missing session or missing, malformed or invalid service key. A corrupt stored session
        identity returns 500.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    '403':
      description: Role, service key or cross-origin request forbidden
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    '404':
      description: Resource absent or outside owner/team scope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    '405':
      description: >-
        Unsupported method at a known domain path; outer authentication/session policy still
        applies. Allow lists explicit registered methods, without implicit HEAD.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
      headers:
        Allow:
          schema: {type: string}
          description: >-
            Explicit registered methods, comma-space separated; GET also accepts HEAD even when
            HEAD is absent here.
    '500':
      description: Storage or session unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    '503':
      description: Dependency unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NoContent: {description: Success; no response body}
    AuthRedirect:
      description: Redirect to the OIDC provider or /. May include an HTML redirect body.
      headers:
        Location:
          description: Configured OIDC authorization URL or /
          schema: {type: string}
      content:
        text/html:
          schema: {type: string}
    SessionUnavailable:
      description: Session unavailable
      content:
        text/plain:
          schema: {type: string}
          example: "session unavailable\n"
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthMethodNotAllowed:
      description: Unsupported method (ServeMux); GET also accepts HEAD.
      headers:
        Allow:
          schema: {type: string}
      content:
        text/plain:
          schema: {type: string}
    SearchResults:
      description: Success
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/Source'}
            maxItems: 3
  parameters:
    ID:
      name: id
      in: path
      required: true
      description: id
      schema: {type: string, minLength: 1}
  requestBodies:
    Query:
      required: true
      description: JSON, at most 1 MiB. Unknown fields rejected.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Query'}
