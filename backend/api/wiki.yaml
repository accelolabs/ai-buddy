openapi: 3.1.1
info:
  title: Wiki API
  version: 1.0.0
  description: Browser POST requests reject cross-origin requests using Sec-Fetch-Site and Origin (HTTP
    403). Sessions use a Secure, HttpOnly, SameSite=Lax __Host-session cookie scoped to this service.
    JSON request bodies reject unknown fields and trailing JSON; maximum body size is 1 MiB. Internal
    routes accept only the documented Bearer service keys. Ownership and team identity come from the session
    or trusted internal path, never JSON.
paths:
  /health/live:
    get:
      operationId: wiki_get_health_live
      summary: Process liveness
      description: Public endpoint.
      security: []
      responses:
        '204':
          description: Success; no response body
  /health/ready:
    get:
      operationId: wiki_get_health_ready
      summary: Database readiness
      description: Public endpoint.
      security: []
      responses:
        '204':
          description: Success; no response body
        '503':
          description: Database unavailable
          content:
            text/plain:
              schema:
                type: string
              example: 'database unavailable

                '
  /api/auth/login:
    get:
      operationId: wiki_get_api_auth_login
      summary: OIDC login
      description: OIDC authorization code flow with state, nonce and PKCE. Login state expires in five
        minutes. Callback is single-use; successful callback renews the session and redirects to /. Login
        redirects to the configured provider. Session cookie never appears in response JSON.
      security: []
      responses:
        '302':
          description: Success; no response body
          headers:
            Location:
              description: Configured OIDC authorization URL or /
              schema:
                type: string
        '500':
          description: Session unavailable
          content:
            text/plain:
              schema:
                type: string
              example: 'session unavailable

                '
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/callback:
    get:
      operationId: wiki_get_api_auth_callback
      summary: OIDC callback
      description: OIDC authorization code flow with state, nonce and PKCE. Login state expires in five
        minutes. Callback is single-use; successful callback renews the session and redirects to /. Login
        redirects to the configured provider. Session cookie never appears in response JSON.
      security: []
      responses:
        '302':
          description: Success; no response body
          headers:
            Location:
              description: Configured OIDC authorization URL or /
              schema:
                type: string
        '500':
          description: Session unavailable
          content:
            text/plain:
              schema:
                type: string
              example: 'session unavailable

                '
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid/expired callback or failed authentication
          content:
            text/plain:
              schema:
                type: string
              example: 'invalid login

                '
      parameters:
      - name: code
        in: query
        required: false
        description: code
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: state
        schema:
          type: string
      - name: error
        in: query
        required: false
        description: error
        schema:
          type: string
  /api/auth/me:
    get:
      operationId: wiki_get_api_auth_me
      summary: Current user
      description: Authenticated intern or mentor session. Access to another owner or team is rejected;
        no data are disclosed.
      security:
      - Session: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /api/auth/logout:
    post:
      operationId: wiki_post_api_auth_logout
      summary: Destroy this service session
      description: Same-origin browser POST; also succeeds when already logged out. Destroy only this
        service session.
      security: []
      responses:
        '204':
          description: Success; no response body
        '403':
          $ref: '#/components/responses/403'
        '500':
          description: Session unavailable
          content:
            text/plain:
              schema:
                type: string
              example: 'session unavailable

                '
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/documents:
    get:
      operationId: wiki_get_api_documents
      summary: Read team documentation
      description: Authenticated intern or mentor session. Access to another owner or team is rejected;
        no data are disclosed. Only common and current team documents are visible. Empty results are [].
        URLs are relative /api/documents/{id}; markdown is returned as source text. Internal search resolves
        team through Authentik, does not trust a team parameter.
      security:
      - Session: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Metadata'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /api/documents/{id}:
    get:
      operationId: wiki_get_api_documents_id
      summary: Read team documentation
      description: Authenticated intern or mentor session. Access to another owner or team is rejected;
        no data are disclosed. Only common and current team documents are visible. Empty results are [].
        URLs are relative /api/documents/{id}; markdown is returned as source text. Internal search resolves
        team through Authentik, does not trust a team parameter.
      security:
      - Session: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
          minLength: 1
  /api/search:
    post:
      operationId: wiki_post_api_search
      summary: Search team documentation
      description: Authenticated intern or mentor session. Access to another owner or team is rejected;
        no data are disclosed. Only common and current team documents are visible. Empty results are [].
        URLs are relative /api/documents/{id}; markdown is returned as source text. Internal search resolves
        team through Authentik, does not trust a team parameter.
      security:
      - Session: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        description: JSON, at most 1 MiB. Unknown fields rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Query'
  /internal/users/{id}/search:
    post:
      operationId: wiki_post_internal_users_id_search
      summary: Search team documentation
      description: 'Internal: Bearer Buddy key; path identifies the user. Access to another owner or team
        is rejected; no data are disclosed. Only common and current team documents are visible. Empty
        results are []. URLs are relative /api/documents/{id}; markdown is returned as source text. Internal
        search resolves team through Authentik, does not trust a team parameter.'
      security:
      - ServiceKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        description: JSON, at most 1 MiB. Unknown fields rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Query'
components:
  securitySchemes:
    Session:
      type: apiKey
      in: cookie
      name: __Host-session
    ServiceKey:
      type: http
      scheme: bearer
      description: Buddy service API key. Tracker mentor lookup also permits the Ticket key; other Tracker
        routes reject it with 403.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
      example:
        error: invalid input
    User:
      type: object
      properties:
        authentik_id:
          type: string
        role:
          type: string
        team:
          type: string
        name:
          type: string
        email:
          type: string
        preferred_username:
          type: string
      required:
      - authentik_id
      - role
      - team
      - name
      - email
      - preferred_username
    Metadata:
      type: object
      properties:
        id:
          type: string
        path:
          type: string
        title:
          type: string
        url:
          type: string
      required:
      - id
      - path
      - title
      - url
      example:
        id: document
        path: common/guide.md
        title: Guide
        url: /api/documents/document
    Document:
      type: object
      properties:
        id:
          type: string
        path:
          type: string
        title:
          type: string
        url:
          type: string
        markdown:
          type: string
      required:
      - id
      - path
      - title
      - url
      - markdown
    Source:
      type: object
      properties:
        document_id:
          type: string
        document_title:
          type: string
        section_title:
          type: string
        anchor:
          type: string
        text:
          type: string
        url:
          type: string
      required:
      - document_id
      - document_title
      - section_title
      - anchor
      - text
      - url
    Query:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4000
          description: Trimmed; whitespace-only is invalid.
      required:
      - query
      additionalProperties: false
      example:
        query: How do I set up my workspace?
  responses:
    '400':
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      description: Missing or invalid session / API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '403':
      description: Role, service key or cross-origin request forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: Resource absent or outside owner/team scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '405':
      description: Method not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '409':
      description: Idempotency or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '422':
      description: Ментор не назначен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '500':
      description: Storage or session unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '503':
      description: Dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
