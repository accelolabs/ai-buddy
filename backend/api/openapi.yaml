        '403':
          $ref: '#/components/responses/Wiki403'
        '404':
          $ref: '#/components/responses/Wiki404'
        '500':
          $ref: '#/components/responses/Wiki500'
        '503':
          description: Dependency or profile database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/Wiki405'
        '400':
          description: Invalid input or missing, empty or unknown demo_user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/WikiID'
      tags:
      - Wiki
  /api/search:
    post:
      operationId: wiki_post_api_search
      summary: Search team documentation
      description: Selected intern or mentor profile. Access to another
        owner or team is rejected; no data are disclosed. Only common and current
        team documents are visible. Empty results are []. URLs are relative /api/documents/{id};
        markdown is returned as source text. Internal search resolves team through
        Authentik, does not trust a team parameter.
      responses:
        '200':
          $ref: '#/components/responses/WikiSearchResults'
        '400':
          description: Invalid input or missing, empty or unknown demo_user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Wiki403'
        '500':
          $ref: '#/components/responses/Wiki500'
        '503':
          description: Dependency or profile database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/Wiki405'
      requestBody:
        $ref: '#/components/requestBodies/WikiQuery'
      tags:
      - Wiki
  /api/users:
    get:
      operationId: listUsers
      tags:
      - Users
      summary: Demo profiles sorted by ID
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - users
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
        '503':
          description: Profile database unavailable
      security: []
  /api/me:
    get:
      operationId: selectedUser
      tags:
      - Users
      summary: Selected demo profile
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '503':
          description: Profile database unavailable
        '400':
          description: Missing, empty or unknown demo_user
components:
  securitySchemes:
    DemoUser:
      type: apiKey
      in: cookie
      name: demo_user
      description: Demo profile selector; no authentication or identity verification.
  schemas:
    BuddyError:
      type: object
      properties:
        error:
          type: string
      required:
      - error
      example:
        error: invalid input
      additionalProperties: false
    BuddyChat:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          maxLength: 80
        created_at:
          type: string
          format: date-time
      required:
      - id
      - title
      - created_at
      additionalProperties: false
    BuddyRun:
      type: object
      properties:
        id:
          type: string
        chat_id:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - done
          - error
        error:
          type: string
        events_url:
          type: string
      required:
      - id
      - chat_id
      - status
      - error
      - events_url
      description: One active run per chat. Errors require manual retry. An interrupted
        response remains in history.
      additionalProperties: false
    BuddyTaskFields:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Must contain non-whitespace text. Length bounds count the submitted
            Unicode characters.
        description:
          type:
          - string
          - 'null'
          maxLength: 10000
          description: Null or omission decodes to an empty string.
        deadline:
          type: string
          format: date
      required:
      - title
      - deadline
      additionalProperties: false
    BuddyTicketFields:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 200
          description: Must contain non-whitespace text. Length bounds count the submitted
            Unicode characters.
        description:
          type: string
          minLength: 1
          maxLength: 10000
          description: Must contain non-whitespace text. Length bounds count the submitted
            Unicode characters.
      required:
      - question
      - description
      additionalProperties: false
    BuddyFields:
      oneOf:
      - $ref: '#/components/schemas/BuddyTaskFields'
      - $ref: '#/components/schemas/BuddyTicketFields'
    BuddyAction:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        kind:
          type: string
          enum:
          - create_task
          - create_ticket
        status:
          type: string
          enum:
          - draft
          - executing
          - done
          - error
          - cancelled
        fields:
          $ref: '#/components/schemas/BuddyFields'
        result:
          anyOf:
          - $ref: '#/components/schemas/BuddyTaskResult'
          - $ref: '#/components/schemas/BuddyTicketResult'
          - type: 'null'
        error:
          type: string
      required:
      - id
      - run_id
      - kind
      - status
      - fields
      - result
      - error
      description: 'Confirm freezes fields atomically and uses buddy-action:{id} downstream
        forever. Executing/cancelled actions conflict. A done action is returned without
        another write. Retry an error manually with the same fields (or omit them).
        Cancel only a draft; repeated cancel succeeds. Result is null until a downstream
        result is saved. An HTTP 200 action may have status error: inspect status
        and error. Frozen fields retain the submitted JSON representation, including
        a null task description; downstream decoding treats it as an empty string.'
      additionalProperties: false
    BuddyMessage:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - run_id
      - role
      - content
      - created_at
      additionalProperties: false
    BuddyCard:
      type: object
      properties:
        run_id:
          type: string
        kind:
          type: string
          enum:
          - source
          - result
        data:
          type: object
      required:
      - run_id
      - kind
      - data
      additionalProperties: false
    BuddyHistory:
      type: object
      properties:
        chat:
          $ref: '#/components/schemas/BuddyChat'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/BuddyMessage'
        runs:
          type: array
          items:
            $ref: '#/components/schemas/BuddyRun'
        latest_run:
          anyOf:
          - $ref: '#/components/schemas/BuddyRun'
          - type: 'null'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/BuddyAction'
        cards:
          type: array
          items:
            $ref: '#/components/schemas/BuddyCard'
      required:
      - chat
      - messages
      - runs
      - latest_run
      - actions
      - cards
      description: All collections use [], never null. latest_run is null for an empty
        chat.
      additionalProperties: false
    BuddyStageEvent:
      type: string
      description: waiting_for_model, choosing_tools, answering, or the tool name.
      example: answering
    BuddyTextEvent:
      type: string
      description: Incremental text, committed to the assistant message before transmission.
      example: Hello
    BuddySourceEvent:
      type: object
      properties:
        document_id:
          type: string
        document_title:
          type: string
        section_title:
          type: string
        text:
          type: string
        url:
          type: string
      required:
      - document_id
      - document_title
      - section_title
      - text
      - url
    BuddyActionEvent:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - create_task
          - create_ticket
        status:
          type: string
          enum:
          - draft
        fields:
          $ref: '#/components/schemas/BuddyFields'
      required:
      - id
      - kind
      - status
      - fields
    BuddyResultEvent:
      $ref: '#/components/schemas/BuddyTaskResult'
    BuddyUsageEvent:
      type: object
      properties:
        prompt_eval_count:
          type: integer
        num_ctx:
          type: integer
          const: 4096
      required:
      - prompt_eval_count
      - num_ctx
    BuddyDoneEvent:
      type: object
      properties:
        status:
          type: string
          enum:
          - done
        error:
          type: string
          enum:
          - ''
      required:
      - status
      - error
    BuddyErrorEvent:
      type: object
      properties:
        status:
          type: string
          enum:
          - error
        error:
          type: string
      required:
      - status
      - error
    BuddyTaskResult:
      type: object
      properties:
        id:
          type: string
        intern_id:
          type: string
        title:
          type: string
        description:
          type: string
        deadline:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type: string
          enum:
          - pending
          - completed
        overdue:
          type: boolean
      required:
      - id
      - intern_id
      - title
      - description
      - deadline
      - created_at
      - completed_at
      - status
      - overdue
      description: Overdue means incomplete with deadline earlier than the current
        APP_TIMEZONE calendar date. Completed tasks always have overdue=false. Dates
        are YYYY-MM-DD; timestamps include a timezone.
      example:
        id: task
        intern_id: intern
        title: Read guide
        description: Setup
        deadline: '2026-12-01'
        created_at: '2026-11-14T12:00:00Z'
        completed_at: '2026-11-14T12:05:00Z'
        status: completed
        overdue: false
      additionalProperties: false
    BuddyTicketResult:
      type: object
      properties:
        id:
          type: string
        sender_id:
          type: string
        recipient_id:
          type: string
        question:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - sender_id
      - recipient_id
      - question
      - description
      - created_at
      additionalProperties: false
    TrackerError:
      type: object
      properties:
        error:
          type: string
      required:
      - error
      example:
        error: invalid input
      additionalProperties: false
    TrackerTask:
      type: object
      properties:
        id:
          type: string
        intern_id:
          type: string
        title:
          type: string
        description:
          type: string
        deadline:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type: string
          enum:
          - pending
          - completed
        overdue:
          type: boolean
      required:
      - id
      - intern_id
      - title
      - description
      - deadline
      - created_at
      - completed_at
      - status
      - overdue
      description: Overdue means incomplete with deadline earlier than the current
        APP_TIMEZONE calendar date. Completed tasks always have overdue=false. Dates
        are YYYY-MM-DD; timestamps include a timezone. Task lists are ordered by created_at
        then ID. Next task is the first overdue task in list order, otherwise the
        nearest deadline with list-order ties.
      additionalProperties: false
    TrackerCreateTask:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          description: Trimmed before validation and idempotency comparison.
          x-trim: true
        description:
          type:
          - string
          - 'null'
          description: Trimmed before validation and idempotency comparison. Null
            or omission decodes to an empty string.
          x-trim: true
        deadline:
          type: string
          format: date
          description: Trimmed before validation and idempotency comparison.
          x-trim: true
      required:
      - title
      - deadline
      additionalProperties: false
      example:
        title: Read the guide
        description: First task
        deadline: '2026-12-01'
    TrackerProgress:
      type: object
      properties:
        intern:
          $ref: '#/components/schemas/Profile'
        mentor:
          anyOf:
          - $ref: '#/components/schemas/Profile'
          - type: 'null'
        start_date:
          type:
          - string
          - 'null'
          format: date
        goals:
          type: string
        expectations:
          type: string
        tasks:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TrackerTask'
        completed:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        percent:
          type: integer
          minimum: 0
          maximum: 100
        next_task:
          anyOf:
          - $ref: '#/components/schemas/TrackerTask'
          - type: 'null'
      required:
      - intern
      - mentor
      - start_date
      - goals
      - expectations
      - tasks
      - completed
      - total
      - percent
      - next_task
      description: No mentor, start date or next task is represented by null. Task/profile
        collection DTOs preserve null versus []; normal task service lists are [].
        Mentor can only inspect assigned interns.
      additionalProperties: false
    TicketError:
      type: object
      properties:
        error:
          type: string
      required:
      - error
      example:
        error: invalid input
      additionalProperties: false
    TicketTicket:
      type: object
      properties:
        id:
          type: string
        sender_id:
          type: string
        recipient_id:
          type: string
        question:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - sender_id
      - recipient_id
      - question
      - description
      - created_at
      additionalProperties: false
    TicketCreateTicket:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          description: Trimmed; must contain non-whitespace text. No additional character
            limit beyond the body-size limit.
          x-trim: true
        description:
          type: string
          minLength: 1
          description: Trimmed; must contain non-whitespace text. No additional character
            limit beyond the body-size limit.
          x-trim: true
      required:
      - question
      - description
      additionalProperties: false
      example:
        question: Help with setup?
        description: Describe the problem and attempted steps.
    TicketTickets:
      type: object
      properties:
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/TicketTicket'
      required:
      - tickets
      description: Empty lists are [], never null.
      additionalProperties: false
    WikiError:
      type: object
      properties:
        error:
          type: string
      required:
      - error
      example:
        error: invalid input
      additionalProperties: false
    WikiMetadata:
      type: object
      properties:
        id:
          type: string
        path:
          type: string
        title:
          type: string
        url:
          type: string
      required:
      - id
      - path
      - title
      - url
      example:
        id: document
        path: common/guide.md
        title: Guide
        url: /api/documents/document
      additionalProperties: false
    WikiDocument:
      type: object
      properties:
        id:
          type: string
        path:
          type: string
        title:
          type: string
        url:
          type: string
        markdown:
          type: string
      required:
      - id
      - path
      - title
      - url
      - markdown
      additionalProperties: false
    WikiSource:
      type: object
      properties:
        document_id:
          type: string
        document_title:
          type: string
        section_title:
          type: string
        anchor:
          type: string
        text:
          type: string
        url:
          type: string
      required:
      - document_id
      - document_title
      - section_title
      - anchor
      - text
      - url
      additionalProperties: false
    WikiQuery:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4000
          description: Trimmed; whitespace-only is invalid.
      required:
      - query
      additionalProperties: false
      example:
        query: How do I set up my workspace?
    Profile:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - username
      - email
      - role
      - team
      - start_date
      - goals
      - expectations
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - intern
          - mentor
        team:
          type: string
        goals:
          type: string
        expectations:
          type: string
        start_date:
          type:
          - string
          - 'null'
          format: date
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
  responses:
    Buddy403:
      description: Role forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BuddyError'
    Buddy404:
