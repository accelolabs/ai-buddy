    Tracker500:
      description: Storage unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TrackerError'
    TrackerTask:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TrackerTask'
    TrackerTaskReplay:
