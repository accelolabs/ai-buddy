openapi: 3.1.1
info:
  title: AI Buddy Demo API
  version: 2.0.0
  description: >-
    Select a database profile with demo_user=<id>; Path=/; SameSite=Lax on the same origin; this is not authentication.
    Missing, empty or unknown IDs return JSON 400; profile database failures return 503. Selection is pinned per Buddy run.
    Role and team come from the database; other users' resources are hidden. Unknown paths and unsupported health methods return JSON 404; unsupported API methods return 405. GET also accepts HEAD.
    JSON bodies use encoding/json: field names match case-insensitively, repeated fields use the last value, and Content-Type is not checked.
    Unknown fields and trailing JSON are rejected; limit 1 MiB. Schemas show canonical names and cannot express duplicate-key decoding.
    Required text must contain non-whitespace. Direct task/ticket writes trim strings; Buddy draft limits apply before trimming.
    Text limits count Unicode code points; idempotency key limits count UTF-8 bytes. x-trim and x-maxBytes document server checks. Collections use []; absent mentor, dates, next task and action result use null.
    Document links are relative /api/documents/{id}.
servers:
- url: https://{host}
  variables:
    host: {default: buddy.example.com}
- {url: 'http://localhost:8080'}
tags:
- {name: Users, description: Public profile list; /me requires selection.}
- {name: Buddy, description: Intern only.}
- {name: Tracker, description: Intern tasks and progress; /interns routes are mentor only.}
- {name: Ticket, description: Intern sent tickets and creation; incoming tickets are mentor only.}
- {name: Wiki, description: Common and selected-team documents.}
security:
- DemoUser: []
paths:
  /health/live:
    get:
      operationId: buddy_get_health_live
      summary: Process liveness
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
      tags: [Buddy]
      security: []
  /health/ready:
    get:
      operationId: buddy_get_health_ready
      summary: Database readiness
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '503': {$ref: '#/components/responses/Error503'}
      tags: [Buddy]
      security: []
  /api/chats:
    post:
      operationId: buddy_post_api_chats
      summary: Create chat
      responses:
        '201':
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Chat'}
          description: Success.
        '403': {$ref: '#/components/responses/Error403'}
        '500': {$ref: '#/components/responses/Error500'}
        '405': {$ref: '#/components/responses/Error405'}
        '400': {$ref: '#/components/responses/Error400'}
        '503': {$ref: '#/components/responses/Error503'}
      tags: [Buddy]
    get:
      operationId: buddy_get_api_chats
      summary: List own chats
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  chats:
                    type: array
                    items: {$ref: '#/components/schemas/Chat'}
                required: [chats]
          description: Success.
        '403': {$ref: '#/components/responses/Error403'}
        '500': {$ref: '#/components/responses/Error500'}
        '405': {$ref: '#/components/responses/Error405'}
        '400': {$ref: '#/components/responses/Error400'}
        '503': {$ref: '#/components/responses/Error503'}
      tags: [Buddy]
  /api/chats/{id}:
    get:
      operationId: buddy_get_api_chats_id
      summary: Read chat history
      responses:
        '200':
          content:
            application/json:
              schema: {$ref: '#/components/schemas/History'}
          description: Success.
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '500': {$ref: '#/components/responses/Error500'}
        '405': {$ref: '#/components/responses/Error405'}
        '400': {$ref: '#/components/responses/Error400'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/ID'}
      tags: [Buddy]
  /api/chats/{id}/messages:
    post:
      operationId: buddy_post_api_chats_id_messages
      summary: Send message
      responses:
        '202': {$ref: '#/components/responses/Run'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '500': {$ref: '#/components/responses/Error500'}
        '405': {$ref: '#/components/responses/Error405'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/ID'}
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 1, maxLength: 200, x-maxBytes: 200}
        description: Non-whitespace, verbatim key scoped to chat; at most 200 UTF-8 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: {type: string, minLength: 1, maxLength: 2000}
              required: [content]
              additionalProperties: false
      tags: [Buddy]
      description: Same key and original content returns the same run (202); changed content or another active run returns 409.
        Disconnect does not stop generation.
  /api/runs/{id}/retry:
    post:
      operationId: buddy_post_api_runs_id_retry
      summary: Retry failed run
      responses:
        '202': {$ref: '#/components/responses/Run'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '500': {$ref: '#/components/responses/Error500'}
        '405': {$ref: '#/components/responses/Error405'}
        '400': {$ref: '#/components/responses/Error400'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/ID'}
      tags: [Buddy]
      description: Only error runs; reuse the original message. Repeating retry returns one new run. Another active run returns
        409; restart never retries automatically.
  /api/actions/{id}/confirm:
    post:
      operationId: buddy_post_api_actions_id_confirm
      summary: Confirm action
      responses:
        '200': {$ref: '#/components/responses/Action'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '500': {$ref: '#/components/responses/Error500'}
        '405': {$ref: '#/components/responses/Error405'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/ID'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: [object, 'null']
              properties:
                fields:
                  anyOf:
                  - {$ref: '#/components/schemas/DraftFields'}
                  - {type: 'null'}
              required: []
              additionalProperties: false
        description: Required JSON; {}, top-level null, omitted or null fields reuse saved fields.
      tags: [Buddy]
      description: First confirmation freezes fields and uses buddy-action:<id>. Done actions replay the saved result; retry errors
        with unchanged fields. HTTP 200 may contain action status=error.
  /api/actions/{id}/cancel:
    post:
      operationId: buddy_post_api_actions_id_cancel
      summary: Cancel draft
      responses:
        '200': {$ref: '#/components/responses/Action'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '500': {$ref: '#/components/responses/Error500'}
        '405': {$ref: '#/components/responses/Error405'}
        '400': {$ref: '#/components/responses/Error400'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/ID'}
      tags: [Buddy]
      description: Cancel a draft; repeated cancellation succeeds. Other states return 409.
  /api/runs/{id}/events:
    get:
      operationId: buddy_get_api_runs_id_events
      summary: Replay and follow persisted run events
      responses:
        '200':
          content:
            text/event-stream:
              schema: {type: string}
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-cache]
            X-Accel-Buffering:
              schema:
                type: string
                enum: ['no']
          description: Replay and follow persisted events.
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '500': {$ref: '#/components/responses/Error500'}
        '405': {$ref: '#/components/responses/Error405'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/ID'}
      - name: Last-Event-ID
        in: header
        required: false
        schema: {type: string, pattern: '^([+]?[0-9]+|-0+)$'}
        description: Nonnegative signed int64 cursor; +1 and -0 are accepted; overflow is rejected.
      x-event-payloads:
        stage: {$ref: '#/components/schemas/StageEvent'}
        text: {$ref: '#/components/schemas/TextEvent'}
        source: {$ref: '#/components/schemas/Source'}
        action: {$ref: '#/components/schemas/ActionEvent'}
        result: {$ref: '#/components/schemas/Task'}
        usage: {$ref: '#/components/schemas/UsageEvent'}
        done: {$ref: '#/components/schemas/DoneEvent'}
        error: {$ref: '#/components/schemas/RunErrorEvent'}
      tags: [Buddy]
      description: 'SSE frames: integer id, event name, JSON data. Replay strictly after Last-Event-ID; ignore duplicate IDs. Heartbeat
        comments every 15s have no ID. Disconnect does not cancel the run; stream closes after done/error. Interrupted runs become
        error on restart.'
  /api/tasks:
    post:
      operationId: tracker_post_api_tasks
      summary: Create task
      responses:
        '201': {$ref: '#/components/responses/Task'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '500': {$ref: '#/components/responses/Error500'}
        '200': {$ref: '#/components/responses/Task'}
        '405': {$ref: '#/components/responses/Error405'}
        '503': {$ref: '#/components/responses/Error503'}
      requestBody: {$ref: '#/components/requestBodies/CreateTask'}
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      tags: [Tracker]
      description: 201 on creation; 200 on identical-key replay; changed trimmed fields return 409.
  /api/tasks/{taskID}/complete:
    post:
      operationId: tracker_post_api_tasks_taskID_complete
      summary: Complete task idempotently
      responses:
        '200': {$ref: '#/components/responses/Task'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '500': {$ref: '#/components/responses/Error500'}
        '405': {$ref: '#/components/responses/Error405'}
        '400': {$ref: '#/components/responses/Error400'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/TaskID'}
      tags: [Tracker]
      description: Repeated completion preserves the original completed_at.
  /api/progress:
    get:
      operationId: tracker_get_api_progress
      summary: Read progress
      responses:
        '200': {$ref: '#/components/responses/Progress'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '500': {$ref: '#/components/responses/Error500'}
        '405': {$ref: '#/components/responses/Error405'}
        '400': {$ref: '#/components/responses/Error400'}
        '503': {$ref: '#/components/responses/Error503'}
      tags: [Tracker]
  /api/interns:
    get:
      operationId: tracker_get_api_interns
      summary: Read interns
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  interns:
                    type: array
                    items: {$ref: '#/components/schemas/Profile'}
                required: [interns]
          description: Success.
        '403': {$ref: '#/components/responses/Error403'}
        '500': {$ref: '#/components/responses/Error500'}
        '405': {$ref: '#/components/responses/Error405'}
        '400': {$ref: '#/components/responses/Error400'}
        '503': {$ref: '#/components/responses/Error503'}
      tags: [Tracker]
  /api/interns/{id}/progress:
    get:
      operationId: tracker_get_api_interns_id_progress
      summary: Read progress
      responses:
        '200': {$ref: '#/components/responses/Progress'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '500': {$ref: '#/components/responses/Error500'}
        '405': {$ref: '#/components/responses/Error405'}
        '400': {$ref: '#/components/responses/Error400'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/ID'}
      tags: [Tracker]
  /api/tickets:
    get:
      operationId: ticket_get_api_tickets
      summary: List own sent questions
      responses:
        '200': {$ref: '#/components/responses/Tickets'}
        '403': {$ref: '#/components/responses/Error403'}
        '500': {$ref: '#/components/responses/Error500'}
        '405': {$ref: '#/components/responses/Error405'}
        '400': {$ref: '#/components/responses/Error400'}
        '503': {$ref: '#/components/responses/Error503'}
      tags: [Ticket]
    post:
      operationId: ticket_post_api_tickets
      summary: Send question to assigned mentor
      responses:
        '201': {$ref: '#/components/responses/Ticket'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '422': {$ref: '#/components/responses/Error422'}
        '500': {$ref: '#/components/responses/Error500'}
        '503': {$ref: '#/components/responses/Error503'}
        '200': {$ref: '#/components/responses/Ticket'}
        '405': {$ref: '#/components/responses/Error405'}
      requestBody: {$ref: '#/components/requestBodies/CreateTicket'}
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      tags: [Ticket]
      description: 201 on creation; 200 on identical-key replay; changed trimmed fields return 409. Recipient is the assigned mentor
        at creation; replay works after reassignment. No mentor returns 422.
  /api/tickets/incoming:
    get:
      operationId: ticket_get_api_tickets_incoming
      summary: List incoming questions
      responses:
        '200': {$ref: '#/components/responses/Tickets'}
        '403': {$ref: '#/components/responses/Error403'}
        '500': {$ref: '#/components/responses/Error500'}
        '405': {$ref: '#/components/responses/Error405'}
        '400': {$ref: '#/components/responses/Error400'}
        '503': {$ref: '#/components/responses/Error503'}
      tags: [Ticket]
  /api/documents:
    get:
      operationId: wiki_get_api_documents
      summary: List available documents
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DocumentMetadata'}
          description: Success.
        '503': {$ref: '#/components/responses/Error503'}
        '405': {$ref: '#/components/responses/Error405'}
        '400': {$ref: '#/components/responses/Error400'}
      tags: [Wiki]
  /api/documents/{id}:
    get:
      operationId: wiki_get_api_documents_id
      summary: Read document Markdown
      responses:
        '200':
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
          description: Success.
        '404': {$ref: '#/components/responses/Error404'}
        '503': {$ref: '#/components/responses/Error503'}
        '405': {$ref: '#/components/responses/Error405'}
        '400': {$ref: '#/components/responses/Error400'}
      parameters:
      - {$ref: '#/components/parameters/ID'}
      tags: [Wiki]
  /api/users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: Demo profiles sorted by ID
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: {$ref: '#/components/schemas/Profile'}
          description: Success.
        '503': {$ref: '#/components/responses/Error503'}
        '405': {$ref: '#/components/responses/Error405'}
      security: []
  /api/me:
    get:
      operationId: selectedUser
      tags: [Users]
      summary: Selected demo profile
      responses:
        '200':
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
          description: Success.
        '503': {$ref: '#/components/responses/Error503'}
        '400': {$ref: '#/components/responses/Error400'}
        '405': {$ref: '#/components/responses/Error405'}
components:
  securitySchemes:
    DemoUser: {type: apiKey, in: cookie, name: demo_user, description: 'Demo profile selection, without authentication.'}
  schemas:
    Error:
      type: object
      properties:
        error: {type: string}
      required: [error]
      additionalProperties: false
    Chat:
      type: object
      properties:
        id: {type: string}
        title: {type: string, maxLength: 80}
        created_at: {type: string, format: date-time}
      required: [id, title, created_at]
      additionalProperties: false
    Run:
      type: object
      properties:
        id: {type: string}
        chat_id: {type: string}
        status:
          type: string
          enum: [queued, running, done, error]
        error: {type: string}
        events_url: {type: string}
      required: [id, chat_id, status, error, events_url]
      additionalProperties: false
    TaskDraft:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description:
          type: [string, 'null']
          maxLength: 10000
          description: Omitted or null becomes empty string.
        deadline: {type: string, format: date}
      required: [title, deadline]
      additionalProperties: false
    TicketDraft:
      type: object
      properties:
        question: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, minLength: 1, maxLength: 10000}
      required: [question, description]
      additionalProperties: false
    DraftFields:
      oneOf:
      - {$ref: '#/components/schemas/TaskDraft'}
      - {$ref: '#/components/schemas/TicketDraft'}
    Action:
      type: object
      properties:
        id: {type: string}
        run_id: {type: string}
        kind:
          type: string
          enum: [create_task, create_ticket]
        status:
          type: string
          enum: [draft, executing, done, error, cancelled]
        fields: {$ref: '#/components/schemas/DraftFields'}
        result:
          anyOf:
          - {$ref: '#/components/schemas/Task'}
          - {$ref: '#/components/schemas/Ticket'}
          - {type: 'null'}
        error: {type: string}
      required: [id, run_id, kind, status, fields, result, error]
      additionalProperties: false
    Message:
      type: object
      properties:
        id: {type: string}
        run_id: {type: string}
        role:
          type: string
          enum: [user, assistant]
        content: {type: string}
        created_at: {type: string, format: date-time}
      required: [id, run_id, role, content, created_at]
      additionalProperties: false
    Card:
      type: object
      properties:
        run_id: {type: string}
        kind:
          type: string
          enum: [source, result]
        data: {type: object}
      required: [run_id, kind, data]
      additionalProperties: false
      oneOf:
      - properties:
          kind: {const: source}
          data: {$ref: '#/components/schemas/Source'}
      - properties:
          kind: {const: result}
          data: {$ref: '#/components/schemas/Task'}
    History:
      type: object
      properties:
        chat: {$ref: '#/components/schemas/Chat'}
        messages:
          type: array
          items: {$ref: '#/components/schemas/Message'}
        runs:
          type: array
          items: {$ref: '#/components/schemas/Run'}
        latest_run:
          anyOf:
          - {$ref: '#/components/schemas/Run'}
          - {type: 'null'}
        actions:
          type: array
          items: {$ref: '#/components/schemas/Action'}
        cards:
          type: array
          items: {$ref: '#/components/schemas/Card'}
      required: [chat, messages, runs, latest_run, actions, cards]
      additionalProperties: false
    StageEvent: {type: string, description: 'waiting_for_model, choosing_tools, answering, or tool name.'}
    TextEvent: {type: string}
    Source:
      type: object
      properties:
        document_id: {type: string}
        document_title: {type: string}
        section_title: {type: string}
        text: {type: string}
        url: {type: string}
      required: [document_id, document_title, section_title, text, url]
    ActionEvent:
      type: object
      properties:
        id: {type: string}
        kind:
          type: string
          enum: [create_task, create_ticket]
        status:
          type: string
          enum: [draft]
        fields: {$ref: '#/components/schemas/DraftFields'}
      required: [id, kind, status, fields]
    UsageEvent:
      type: object
      properties:
        prompt_eval_count: {type: integer}
        num_ctx: {type: integer, const: 4096}
      required: [prompt_eval_count, num_ctx]
    DoneEvent:
      type: object
      properties:
        status:
          type: string
          enum: [done]
        error:
          type: string
          enum: ['']
      required: [status, error]
    RunErrorEvent:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        error: {type: string}
      required: [status, error]
    Task:
      type: object
      properties:
        id: {type: string}
        intern_id: {type: string}
        title: {type: string}
        description: {type: string}
        deadline: {type: string, format: date}
        created_at: {type: string, format: date-time}
        completed_at:
          type: [string, 'null']
          format: date-time
        status:
          type: string
          enum: [pending, completed]
        overdue: {type: boolean}
      required: [id, intern_id, title, description, deadline, created_at, completed_at, status, overdue]
      additionalProperties: false
      description: 'Overdue: incomplete and deadline before today in APP_TIMEZONE. Tasks ordered by created_at then ID.'
    Ticket:
      type: object
      properties:
        id: {type: string}
        sender_id: {type: string}
        recipient_id: {type: string}
        question: {type: string}
        description: {type: string}
        created_at: {type: string, format: date-time}
      required: [id, sender_id, recipient_id, question, description, created_at]
      additionalProperties: false
    CreateTask:
      type: object
      properties:
        title: {type: string, minLength: 1, x-trim: true}
        description:
          type: [string, 'null']
          x-trim: true
          description: Omitted or null becomes empty string.
        deadline: {type: string, x-trim: true, description: 'Valid calendar YYYY-MM-DD after trimming surrounding whitespace.'}
      required: [title, deadline]
      additionalProperties: false
    Progress:
      type: object
      properties:
        intern: {$ref: '#/components/schemas/Profile'}
        mentor:
          anyOf:
          - {$ref: '#/components/schemas/Profile'}
          - {type: 'null'}
        start_date:
          type: [string, 'null']
          format: date
        goals: {type: string}
        expectations: {type: string}
        tasks:
          type: array
          items: {$ref: '#/components/schemas/Task'}
        completed: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        percent: {type: integer, minimum: 0, maximum: 100}
        next_task:
          anyOf:
          - {$ref: '#/components/schemas/Task'}
          - {type: 'null'}
      required: [intern, mentor, start_date, goals, expectations, tasks, completed, total, percent, next_task]
      additionalProperties: false
      description: 'Next task: first overdue incomplete task in list order, otherwise nearest deadline with list-order ties.'
    CreateTicket:
      type: object
      properties:
        question: {type: string, minLength: 1, x-trim: true}
        description: {type: string, minLength: 1, x-trim: true}
      required: [question, description]
      additionalProperties: false
    Tickets:
      type: object
      properties:
        tickets:
          type: array
          items: {$ref: '#/components/schemas/Ticket'}
      required: [tickets]
      additionalProperties: false
    DocumentMetadata:
      type: object
      properties:
        id: {type: string}
        path: {type: string}
        title: {type: string}
        url: {type: string}
