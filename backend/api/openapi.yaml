    BuddyRun:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BuddyRun'
    BuddyAction:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BuddyAction'
    Tracker403:
      description: Role forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TrackerError'
    Tracker404:
      description: Resource absent or outside owner/team scope
      content:
        application/json:
