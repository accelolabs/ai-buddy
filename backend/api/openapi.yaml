      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BuddyError'
    Buddy405:
      description: Unsupported method at a known domain path. Allow lists registered methods; GET also accepts HEAD.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BuddyError'
      headers:
        Allow:
          schema:
            type: string
          description: Explicit registered methods, comma-space separated; GET also
            accepts HEAD even when HEAD is absent here.
    Buddy409:
      description: Idempotency or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BuddyError'
    Buddy500:
      description: Storage unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BuddyError'
    BuddyNoContent:
