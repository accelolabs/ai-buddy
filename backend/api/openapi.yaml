openapi: 3.1.1
info:
  title: AI Buddy Demo API
  version: 2.0.0
  description: One backend and one database. demo_user selects a database profile
    without authentication. Set demo_user=<id>; Path=/; SameSite=Lax on the same origin.
    Cookies apply to fetch and EventSource. Missing, empty or unknown IDs return JSON
    400; database failures return JSON 503. Role and team come from the database.
    Selection is pinned to each Buddy run. JSON bodies reject unknown fields and trailing
    JSON, maximum 1 MiB. Unsupported API methods return JSON 405 and unknown paths
    JSON 404.
servers:
- url: https://{host}
  variables:
    host:
      default: buddy.example.com
  description: Public HTTPS
- url: http://localhost:8080
  description: Local demo
tags:
- name: Users
- name: Buddy
- name: Tracker
- name: Ticket
- name: Wiki
security:
- DemoUser: []
paths:
  /health/live:
    get:
      operationId: buddy_get_health_live
      summary: Process liveness
      description: Public endpoint.
      responses:
        '204':
          $ref: '#/components/responses/BuddyNoContent'
      tags:
      - Buddy
      security: []
  /health/ready:
    get:
      operationId: buddy_get_health_ready
      summary: Database readiness
      description: Public endpoint.
      responses:
        '204':
          $ref: '#/components/responses/BuddyNoContent'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Buddy
      security: []
  /api/chats:
    post:
      operationId: buddy_post_api_chats
      summary: chats post
      description: Selected intern profile. Access to another owner
        or team is rejected; no data are disclosed.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuddyChat'
        '403':
          $ref: '#/components/responses/Buddy403'
        '500':
          $ref: '#/components/responses/Buddy500'
        '405':
          $ref: '#/components/responses/Buddy405'
        '400':
          description: Invalid input or missing, empty or unknown demo_user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency or profile database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Buddy
    get:
      operationId: buddy_get_api_chats
      summary: chats get
      description: Selected intern profile. Access to another owner
        or team is rejected; no data are disclosed.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  chats:
                    type: array
                    items:
                      $ref: '#/components/schemas/BuddyChat'
                required:
                - chats
        '403':
          $ref: '#/components/responses/Buddy403'
        '500':
          $ref: '#/components/responses/Buddy500'
        '405':
          $ref: '#/components/responses/Buddy405'
        '400':
          description: Invalid input or missing, empty or unknown demo_user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency or profile database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Buddy
  /api/chats/{id}:
    get:
      operationId: buddy_get_api_chats_id
      summary: '{id} get'
      description: Selected intern profile. Access to another owner
        or team is rejected; no data are disclosed.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuddyHistory'
        '403':
          $ref: '#/components/responses/Buddy403'
        '404':
          $ref: '#/components/responses/Buddy404'
        '500':
          $ref: '#/components/responses/Buddy500'
        '405':
          $ref: '#/components/responses/Buddy405'
        '400':
          description: Invalid input or missing, empty or unknown demo_user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency or profile database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/BuddyID'
      tags:
      - Buddy
  /api/chats/{id}/messages:
    post:
      operationId: buddy_post_api_chats_id_messages
      summary: messages post
      description: Selected intern profile. Access to another owner
        or team is rejected; no data are disclosed. Content must contain non-whitespace.
        Same key and identical original content returns the same run (202); changed
        content or another active run yields 409. Disconnecting does not stop generation.
      responses:
        '202':
          $ref: '#/components/responses/BuddyRun'
        '400':
          description: Invalid input or missing, empty or unknown demo_user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Buddy403'
        '404':
          $ref: '#/components/responses/Buddy404'
        '409':
          $ref: '#/components/responses/Buddy409'
        '500':
          $ref: '#/components/responses/Buddy500'
        '405':
          $ref: '#/components/responses/Buddy405'
        '503':
          description: Dependency or profile database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/BuddyID'
      - name: Idempotency-Key
        in: header
        required: true
        description: Non-whitespace key, at most 200 UTF-8 bytes. Preserved verbatim;
          maxLength is only a character upper bound.
        schema:
          type: string
          minLength: 1
          maxLength: 200
          description: Non-whitespace; scoped to chat.
          x-maxBytes: 200
      requestBody:
        required: true
        description: JSON, at most 1 MiB. Unknown fields rejected.
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 2000
              required:
              - content
              additionalProperties: false
              example:
                content: Help me find the onboarding guide
      tags:
      - Buddy
  /api/runs/{id}/retry:
    post:
      operationId: buddy_post_api_runs_id_retry
      summary: retry post
      description: Selected intern profile. Access to another owner
        or team is rejected; no data are disclosed. Only error runs can be retried.
        The original message is reused. Repeated retry of the same original error
        returns one new run. Another active run causes 409. No automatic retry after
        restart.
      responses:
        '202':
          $ref: '#/components/responses/BuddyRun'
        '403':
          $ref: '#/components/responses/Buddy403'
        '404':
          $ref: '#/components/responses/Buddy404'
        '409':
          $ref: '#/components/responses/Buddy409'
        '500':
          $ref: '#/components/responses/Buddy500'
        '405':
          $ref: '#/components/responses/Buddy405'
        '400':
          description: Invalid input or missing, empty or unknown demo_user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency or profile database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/BuddyID'
      tags:
      - Buddy
  /api/actions/{id}/confirm:
    post:
      operationId: buddy_post_api_actions_id_confirm
      summary: confirm post
      description: Selected intern profile. Access to another owner
        or team is rejected; no data are disclosed.
      responses:
        '200':
          $ref: '#/components/responses/BuddyAction'
        '400':
          description: Invalid input or missing, empty or unknown demo_user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Buddy403'
        '404':
          $ref: '#/components/responses/Buddy404'
        '409':
          $ref: '#/components/responses/Buddy409'
        '500':
          $ref: '#/components/responses/Buddy500'
        '405':
          $ref: '#/components/responses/Buddy405'
        '503':
          description: Dependency or profile database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/BuddyID'
      requestBody:
        required: true
        description: Required JSON body. Both {} and top-level null reuse stored fields;
          omitted or null fields also reuse them.
        content:
          application/json:
            schema:
              type:
              - object
              - 'null'
              properties:
                fields:
                  anyOf:
                  - $ref: '#/components/schemas/BuddyFields'
                  - type: 'null'
              required: []
              additionalProperties: false
              example: {}
      tags:
      - Buddy
  /api/actions/{id}/cancel:
    post:
      operationId: buddy_post_api_actions_id_cancel
      summary: cancel post
      description: Selected intern profile. Access to another owner
        or team is rejected; no data are disclosed.
      responses:
        '200':
          $ref: '#/components/responses/BuddyAction'
        '403':
          $ref: '#/components/responses/Buddy403'
        '404':
          $ref: '#/components/responses/Buddy404'
        '409':
          $ref: '#/components/responses/Buddy409'
        '500':
          $ref: '#/components/responses/Buddy500'
        '405':
          $ref: '#/components/responses/Buddy405'
        '400':
          description: Invalid input or missing, empty or unknown demo_user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency or profile database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/BuddyID'
      tags:
      - Buddy
  /api/runs/{id}/events:
    get:
      operationId: buddy_get_api_runs_id_events
      summary: Replay and follow persisted run events
      description: 'Selected intern profile. Access to another owner
        or team is rejected; no data are disclosed. Each frame has an integer id (per-run
        sequence), event name and one JSON data value. Every 15 seconds of inactivity
        a comment : heartbeat is sent without an id. Client disconnect does not cancel
        the run. Reconnect with Last-Event-ID for replay, including partial text and
        terminal events; duplicate IDs should be ignored. After restart queued/running
        runs terminate with error and require manual retry. Comment heartbeats are
        periodic, have no ID, and do not advance the replay cursor. Payloads are validated
        per event, not as a JSON stream.'
      responses:
        '200':
          description: SSE stream; closes after terminal event. Late subscribers replay
            stored events.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                stream:
                  value: ': heartbeat


                    id: 1

                    event: stage

                    data: "answering"


                    id: 2

                    event: text

                    data: "Hello"


                    id: 3

                    event: usage

                    data: {"prompt_eval_count":128,"num_ctx":4096}


                    id: 4

                    event: done

                    data: {"status":"done","error":""}


                    '
                source:
                  value: 'id: 5

                    event: source

                    data: {"document_id":"guide","document_title":"Guide","section_title":"Setup","text":"Excerpt","url":"https://wiki.example.invalid/api/documents/guide"}


                    '
                action:
                  value: 'id: 6

                    event: action

                    data: {"id":"action","kind":"create_task","status":"draft","fields":{"title":"Read
                    guide","description":"","deadline":"2026-12-01"}}


                    '
                result:
                  value: 'id: 7

                    event: result

                    data: {"id": "task", "intern_id": "intern", "title": "Read guide",
                    "description": "Setup", "deadline": "2026-12-01", "created_at":
                    "2026-11-14T12:00:00Z", "completed_at": "2026-11-14T12:05:00Z",
                    "status": "completed", "overdue": false}


                    '
                error:
                  value: 'id: 8

                    event: error

                    data: {"status":"error","error":"service restarted; retry manually"}


                    '
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-cache
            X-Accel-Buffering:
              schema:
                type: string
                enum:
                - 'no'
        '400':
          description: Invalid input or missing, empty or unknown demo_user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Buddy403'
        '404':
          $ref: '#/components/responses/Buddy404'
        '500':
          $ref: '#/components/responses/Buddy500'
        '405':
          $ref: '#/components/responses/Buddy405'
        '503':
          description: Dependency or profile database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/BuddyID'
      - name: Last-Event-ID
        in: header
        required: false
        description: Nonnegative signed int64 parsed in base 10; +1 and -0 are accepted.
          Replay strictly after this per-run sequence ID; overflow is rejected.
        schema:
          type: string
          pattern: ^([+]?[0-9]+|-0+)$
          description: Nonnegative signed int64 decimal.
      x-event-payloads:
        stage:
          $ref: '#/components/schemas/BuddyStageEvent'
        text:
          $ref: '#/components/schemas/BuddyTextEvent'
        source:
          $ref: '#/components/schemas/BuddySourceEvent'
        action:
          $ref: '#/components/schemas/BuddyActionEvent'
        result:
          $ref: '#/components/schemas/BuddyResultEvent'
        usage:
          $ref: '#/components/schemas/BuddyUsageEvent'
        done:
          $ref: '#/components/schemas/BuddyDoneEvent'
        error:
          $ref: '#/components/schemas/BuddyErrorEvent'
      tags:
      - Buddy
  /api/tasks:
