openapi: 3.1.1
info:
  title: Tracker API
  version: 1.0.0
  description: >-
    Browser POST requests reject cross-origin requests using Sec-Fetch-Site and Origin (HTTP 403).
    Sessions use a Secure, HttpOnly, SameSite=Lax __Host-session cookie scoped to this service.
    JSON request bodies reject unknown fields and trailing JSON; maximum body size is 1 MiB.
    Internal routes accept only the documented Bearer service keys. Ownership and team identity
    come from the session or trusted internal path, never JSON. Known JSON field names are matched
    case-insensitively; duplicate fields use the last value. Content-Type is not enforced. Internal
    callers are trusted to select path user IDs; owner predicates limit data to that selected
    identity. GET also accepts HEAD. Unsupported auth methods return text/plain 405. Unsupported
    health methods fall through to the domain handler (rather than ServeMux 405): Tracker returns
    text/plain 404, Ticket and Wiki return JSON 404, and Buddy applies session/role checks before
    JSON 404. Domain fallbacks return JSON 404/405 after their outer middleware.
servers:
  - url: https://{host}
    description: Public HTTPS
    variables:
      host: {default: tracker.example.com}
  - {url: 'http://localhost:8083', description: Local Compose}
security:
  - {Session: []}
paths:
  /health/live:
    get:
      operationId: tracker_get_health_live
      summary: Process liveness
      description: Public endpoint.
      security: []
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
  /health/ready:
    get:
      operationId: tracker_get_health_ready
      summary: Database readiness
      description: Public endpoint.
      security: []
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '503':
          description: Database unavailable
          content:
            text/plain:
              schema: {type: string}
              example: "database unavailable\n"
  /api/auth/login:
    get:
      operationId: tracker_get_api_auth_login
      summary: OIDC login
      description: >-
        OIDC authorization code flow with state, nonce and PKCE. Login state expires in five
        minutes. Callback is single-use; successful callback renews the session and redirects to /.
        Login redirects to the configured provider. Session cookie never appears in response JSON.
      security: []
      responses:
        '302': {$ref: '#/components/responses/AuthRedirect'}
        '500': {$ref: '#/components/responses/SessionUnavailable'}
        '405': {$ref: '#/components/responses/AuthMethodNotAllowed'}
  /api/auth/callback:
    get:
      operationId: tracker_get_api_auth_callback
      summary: OIDC callback
      description: >-
        OIDC authorization code flow with state, nonce and PKCE. Login state expires in five
        minutes. Callback is single-use; successful callback renews the session and redirects to /.
        Login redirects to the configured provider. Session cookie never appears in response JSON.
      security: []
      responses:
        '302': {$ref: '#/components/responses/AuthRedirect'}
        '500': {$ref: '#/components/responses/SessionUnavailable'}
        '400':
          description: Invalid/expired callback or failed authentication
          content:
            text/plain:
              schema: {type: string}
              example: "invalid login\n"
        '405': {$ref: '#/components/responses/AuthMethodNotAllowed'}
      parameters:
        - name: code
          in: query
          required: false
          description: code
          schema: {type: string}
        - name: state
          in: query
          required: false
          description: state
          schema: {type: string}
        - name: error
          in: query
          required: false
          description: error
          schema: {type: string}
  /api/auth/me:
    get:
      operationId: tracker_get_api_auth_me
      summary: Current user
      description: >-
        Authenticated intern or mentor session. Access to another owner or team is rejected; no
        data are disclosed.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/401'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/AuthMethodNotAllowed'}
  /api/auth/logout:
    post:
      operationId: tracker_post_api_auth_logout
      summary: Destroy this service session
      description: >-
        Same-origin browser POST; also succeeds when already logged out. Destroy only this service
        session.
      security: []
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '403': {$ref: '#/components/responses/403'}
        '500': {$ref: '#/components/responses/SessionUnavailable'}
        '405': {$ref: '#/components/responses/AuthMethodNotAllowed'}
  /api/tasks:
    get:
      operationId: tracker_get_api_tasks
      summary: Read tasks
      description: >-
        Authenticated intern session. Access to another owner or team is rejected; no data are
        disclosed.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: [array, 'null']
                    items: {$ref: '#/components/schemas/Task'}
                required: [tasks]
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '404': {$ref: '#/components/responses/404'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/405'}
    post:
      operationId: tracker_post_api_tasks
      summary: Create task
      description: >-
        Authenticated intern session. Access to another owner or team is rejected; no data are
        disclosed.
      responses:
        '201': {$ref: '#/components/responses/Task'}
        '400': {$ref: '#/components/responses/400'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '404': {$ref: '#/components/responses/404'}
        '409': {$ref: '#/components/responses/409'}
        '500': {$ref: '#/components/responses/500'}
        '200': {$ref: '#/components/responses/TaskReplay'}
        '405': {$ref: '#/components/responses/405'}
      requestBody: {$ref: '#/components/requestBodies/CreateTask'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
  /api/tasks/{taskID}/complete:
    post:
      operationId: tracker_post_api_tasks_taskID_complete
      summary: Complete task idempotently
      description: >-
        Authenticated intern session. Access to another owner or team is rejected; no data are
        disclosed.
      responses:
        '200': {$ref: '#/components/responses/Task'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '404': {$ref: '#/components/responses/404'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/405'}
      parameters:
        - {$ref: '#/components/parameters/TaskID'}
  /api/progress:
    get:
      operationId: tracker_get_api_progress
      summary: Read progress
      description: >-
        Authenticated intern session. Access to another owner or team is rejected; no data are
        disclosed.
      responses:
        '200': {$ref: '#/components/responses/Progress'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '404': {$ref: '#/components/responses/404'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/405'}
  /api/interns:
    get:
      operationId: tracker_get_api_interns
      summary: Read interns
      description: >-
        Authenticated mentor session. Access to another owner or team is rejected; no data are
        disclosed.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  interns:
                    type: [array, 'null']
                    items: {$ref: '#/components/schemas/Profile'}
                required: [interns]
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/405'}
  /api/interns/{id}/progress:
    get:
      operationId: tracker_get_api_interns_id_progress
      summary: Read progress
      description: >-
        Authenticated mentor session. Access to another owner or team is rejected; no data are
        disclosed.
      responses:
        '200': {$ref: '#/components/responses/Progress'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '404': {$ref: '#/components/responses/404'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/405'}
      parameters:
        - {$ref: '#/components/parameters/ID'}
  /internal/interns/{id}/progress:
    get:
      operationId: tracker_get_internal_interns_id_progress
      summary: Read progress
      description: >-
        Internal: Bearer Buddy key; path identifies the user. The trusted service caller selects
        the path user ID; data are filtered to that owner. No independent end-user/team comparison
        is performed.
      security:
        - {ServiceKey: []}
      responses:
        '200': {$ref: '#/components/responses/Progress'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '404': {$ref: '#/components/responses/404'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/405'}
      parameters:
        - {$ref: '#/components/parameters/ID'}
  /internal/interns/{id}/tasks:
    post:
      operationId: tracker_post_internal_interns_id_tasks
      summary: Create task
      description: >-
        Internal: Bearer Buddy key; path identifies the user. The trusted service caller selects
        the path user ID; data are filtered to that owner. No independent end-user/team comparison
        is performed.
      security:
        - {ServiceKey: []}
      responses:
        '201': {$ref: '#/components/responses/Task'}
        '400': {$ref: '#/components/responses/400'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '404': {$ref: '#/components/responses/404'}
        '409': {$ref: '#/components/responses/409'}
        '500': {$ref: '#/components/responses/500'}
        '200': {$ref: '#/components/responses/TaskReplay'}
        '405': {$ref: '#/components/responses/405'}
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/CreateTask'}
  /internal/interns/{id}/tasks/{taskID}/complete:
    post:
      operationId: tracker_post_internal_interns_id_tasks_taskID_complete
      summary: Complete task idempotently
      description: >-
        Internal: Bearer Buddy key; path identifies the user. The trusted service caller selects
        the path user ID; data are filtered to that owner. No independent end-user/team comparison
        is performed.
      security:
        - {ServiceKey: []}
      responses:
        '200': {$ref: '#/components/responses/Task'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '404': {$ref: '#/components/responses/404'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/405'}
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/TaskID'}
  /internal/interns/{id}/mentor:
    get:
      operationId: tracker_get_internal_interns_id_mentor
      summary: Read mentor
      description: >-
        Internal: Bearer Buddy key; path identifies the user. The trusted service caller selects
        the path user ID; data are filtered to that owner. No independent end-user/team comparison
        is performed. Both Buddy and Ticket service keys are allowed here; missing assignment
        returns mentor: null.
      security:
        - {ServiceKey: []}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  mentor:
                    anyOf:
                      - {$ref: '#/components/schemas/Profile'}
                      - {type: 'null'}
                required: [mentor]
        '401': {$ref: '#/components/responses/401'}
        '404': {$ref: '#/components/responses/404'}
        '500': {$ref: '#/components/responses/500'}
        '405': {$ref: '#/components/responses/405'}
      parameters:
        - {$ref: '#/components/parameters/ID'}
components:
  securitySchemes:
    Session: {type: apiKey, in: cookie, name: __Host-session}
    ServiceKey:
      type: http
      scheme: bearer
      description: >-
        Buddy service API key. Tracker mentor lookup also permits the Ticket key; other Tracker
        routes reject it with 403.
  schemas:
    Error:
      type: object
      properties:
        error: {type: string}
      required: [error]
      example: {error: invalid input}
      additionalProperties: false
    User:
      type: object
      properties:
        authentik_id: {type: string}
        role: {type: string}
        team: {type: string}
        name: {type: string}
        email: {type: string}
        preferred_username: {type: string}
      required: [authentik_id, role, team, name, email, preferred_username]
      additionalProperties: false
    Profile:
      type: object
      properties:
        authentik_id: {type: string}
        name: {type: string}
        username: {type: string}
        email: {type: string}
        role: {type: string}
        team: {type: string}
        goals: {type: string}
        expectations: {type: string}
        start_date: {type: [string, 'null'], format: date}
      required: [authentik_id, name, username, email, role, team, goals, expectations, start_date]
      additionalProperties: false
    Task:
      type: object
      properties:
        id: {type: string}
        intern_id: {type: string}
        title: {type: string}
        description: {type: string}
        deadline: {type: string, format: date}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        status: {type: string, enum: [pending, completed]}
        overdue: {type: boolean}
      required: [id, intern_id, title, description, deadline, created_at, completed_at, status, overdue]
      description: >-
        Overdue means incomplete with deadline earlier than the current APP_TIMEZONE calendar date.
        Completed tasks always have overdue=false. Dates are YYYY-MM-DD; timestamps include a
        timezone. Task lists are ordered by created_at then ID. Next task is the first overdue task
        in list order, otherwise the nearest deadline with list-order ties.
      additionalProperties: false
    CreateTask:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          description: Trimmed before validation and idempotency comparison.
          x-trim: true
        description:
          type: [string, 'null']
          description: >-
            Trimmed before validation and idempotency comparison. Null or omission decodes to an
            empty string.
          x-trim: true
        deadline:
          type: string
          format: date
          description: Trimmed before validation and idempotency comparison.
          x-trim: true
      required: [title, deadline]
      additionalProperties: false
      example: {title: Read the guide, description: First task, deadline: '2026-12-01'}
    Progress:
      type: object
      properties:
        intern: {$ref: '#/components/schemas/Profile'}
        mentor:
          anyOf:
            - {$ref: '#/components/schemas/Profile'}
            - {type: 'null'}
        start_date: {type: [string, 'null'], format: date}
        goals: {type: string}
        expectations: {type: string}
        tasks:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/Task'}
        completed: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        percent: {type: integer, minimum: 0, maximum: 100}
        next_task:
          anyOf:
            - {$ref: '#/components/schemas/Task'}
            - {type: 'null'}
      required: [intern, mentor, start_date, goals, expectations, tasks, completed, total, percent, next_task]
      description: >-
        No mentor, start date or next task is represented by null. Task/profile collection DTOs
        preserve null versus []; normal task service lists are []. Mentor can only inspect assigned
        interns.
      additionalProperties: false
  responses:
    '400':
      description: Invalid input
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    '401':
      description: >-
        Missing session or missing, malformed or invalid service key. A corrupt stored session
        identity returns 500.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    '403':
      description: Role, service key or cross-origin request forbidden
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    '404':
      description: Resource absent or outside owner/team scope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    '405':
      description: >-
        Unsupported method at a known domain path; outer authentication/session policy still
        applies. Allow lists explicit registered methods, without implicit HEAD.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
      headers:
        Allow:
          schema: {type: string}
          description: >-
            Explicit registered methods, comma-space separated; GET also accepts HEAD even when
            HEAD is absent here.
    '409':
      description: Idempotency or state conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    '500':
      description: Storage or session unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NoContent: {description: Success; no response body}
    AuthRedirect:
      description: Redirect to the OIDC provider or /. May include an HTML redirect body.
      headers:
        Location:
          description: Configured OIDC authorization URL or /
          schema: {type: string}
      content:
        text/html:
          schema: {type: string}
    SessionUnavailable:
      description: Session unavailable
      content:
        text/plain:
          schema: {type: string}
          example: "session unavailable\n"
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthMethodNotAllowed:
      description: Unsupported method (ServeMux); GET also accepts HEAD.
      headers:
        Allow:
          schema: {type: string}
      content:
        text/plain:
          schema: {type: string}
    Task:
      description: Success
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Task'}
    TaskReplay:
      description: Same key and same normalized fields returns the existing task; changed fields cause 409.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Task'}
    Progress:
      description: Success
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Progress'}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Non-whitespace key, at most 256 UTF-8 bytes. Preserved verbatim; maxLength is only a
        character upper bound.
      schema:
        type: string
        minLength: 1
        maxLength: 256
        x-maxBytes: 256
    TaskID:
      name: taskID
      in: path
      required: true
      description: taskID
      schema: {type: string, minLength: 1}
    ID:
      name: id
      in: path
      required: true
      description: id
      schema: {type: string, minLength: 1}
  requestBodies:
    CreateTask:
      required: true
      description: JSON, at most 1 MiB. Unknown fields rejected.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreateTask'}
