name: buddy-backend

services:
  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADDR: :8080
      RAG_CHUNK_COUNT: ${RAG_CHUNK_COUNT:-3}
      DATABASE_URL: postgres://buddy:${POSTGRES_PASSWORD:-buddy}@postgres:5432/buddy?sslmode=disable
      KNOWLEDGE_BASE_DIR: /knowledge-base
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma:300m}
    volumes:
      - ../knowledge-base:/knowledge-base:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    command: ["./migrate"]
    environment:
      DATABASE_URL: postgres://buddy:${POSTGRES_PASSWORD:-buddy}@postgres:5432/buddy?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: .
    profiles: [tools]
    command: ["./seed"]
    environment:
      DATABASE_URL: postgres://buddy:${POSTGRES_PASSWORD:-buddy}@postgres:5432/buddy?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

  index:
    build: .
    profiles: [tools]
    command: ["./index"]
    environment:
      DATABASE_URL: postgres://buddy:${POSTGRES_PASSWORD:-buddy}@postgres:5432/buddy?sslmode=disable
      KNOWLEDGE_BASE_DIR: /knowledge-base
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma:300m}
    volumes:
      - ../knowledge-base:/knowledge-base:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-model:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 3s
      retries: 20

  ollama-model:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma:300m}
    command:
      - 'ollama show "$$EMBEDDING_MODEL" >/dev/null 2>&1 || ollama pull "$$EMBEDDING_MODEL"'
    depends_on:
      ollama:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buddy}
      POSTGRES_DB: buddy
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddy -d buddy"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres:
  ollama:
