name: CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned Go linter
        run: |
          curl -sSfL https://golangci-lint.run/install.sh -o /tmp/install-golangci.sh
          sh /tmp/install-golangci.sh -b "$(go env GOPATH)/bin" v2.13.2
      - name: Check backend
        working-directory: backend
        run: |
          golangci-lint fmt --diff
          golangci-lint run ./...
          go vet ./...
          go build ./...
      - name: Install frontend dependencies
        working-directory: frontend
        env:
          HUSKY: '0'
        run: npm ci
      - name: Check frontend
        working-directory: frontend
        run: |
          npm run format:check
          npm run lint:check
          npm run build
      - name: Test coverage tool
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test and enforce coverage
        id: coverage
        run: python3 scripts/measure_coverage.py
      - name: Upload coverage reports
        if: ${{ always() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            backend/coverage/
            frontend/coverage/
          retention-days: 14
      - name: Validate Compose and build images
        run: |
          docker compose config --quiet
          docker compose build server web
