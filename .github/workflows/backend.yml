name: Backend
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: buddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d buddy_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/buddy_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install pinned linter
        run: |
          curl -sSfL https://golangci-lint.run/install.sh -o /tmp/install-golangci.sh
          sh /tmp/install-golangci.sh -b "$(go env GOPATH)/bin" v2.13.2
      - name: Check formatting
        working-directory: backend
        run: golangci-lint fmt --diff
      - name: Lint
        working-directory: backend
        run: golangci-lint run ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Build
        working-directory: backend
        run: go build -o /tmp/ai-buddy-server ./cmd/server
      - name: Race tests
        working-directory: backend
        run: go test -race -count=1 ./...
      - name: Validate Compose
        working-directory: backend
        run: docker compose -f deploy/compose.yaml --env-file deploy/.env.example config --quiet
      - name: Tests without database
        working-directory: backend
        run: TEST_DATABASE_URL= go test -race -count=1 ./...
