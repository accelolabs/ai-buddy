name: Backend
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install pinned linter
        run: |
          curl -sSfL https://golangci-lint.run/install.sh -o /tmp/install-golangci.sh
          sh /tmp/install-golangci.sh -b "$(go env GOPATH)/bin" v2.13.2
      - name: Check formatting
        working-directory: backend
        run: golangci-lint fmt --diff
      - name: Lint
        working-directory: backend
        run: golangci-lint run ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Race tests
        working-directory: backend
        run: |
          go test -race -count=1 -coverpkg=./... -coverprofile=/tmp/buddy-coverage.out ./...
          go tool cover -func=/tmp/buddy-coverage.out
      - name: Validate Compose
        working-directory: backend
        run: docker compose config --quiet
