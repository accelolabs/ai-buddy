<svg width="500" height="588" viewBox="0 0 500 588" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card shadow -->
    <filter id="card-shadow" x="14" y="208" width="472" height="360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.02" />
    </filter>

    <!-- Chip logo gradient -->
    <linearGradient id="chip-grad" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="48%" stop-color="#10B981" />
      <stop offset="78%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Background -->
  <rect width="500" height="588" fill="#FFFFFF" />

  <!-- Background decorative trace lines (from login.png) -->
  <path d="M 500 264 H 336 V 334" stroke="#E2E8F0" stroke-width="1.2" fill="none" />
  <circle cx="336" cy="334" r="3" fill="#CBD5E1" />
  <path d="M 456 498 H 500" stroke="#E2E8F0" stroke-width="1.2" fill="none" />
  <path d="M 359 550 V 588" stroke="#E2E8F0" stroke-width="1.2" fill="none" />

  <!-- Header Logo (AI-buddy chip) -->
  <g transform="translate(230, 68) scale(1.6667)">
    <!-- Top pins -->
    <path d="M8 1.8V4.4" stroke-width="2" stroke-linecap="round" stroke="#0EA5E9"/>
    <path d="M12 1.8V4.4" stroke-width="2" stroke-linecap="round" stroke="#0EA5E9"/>
    <path d="M16 1.8V4.4" stroke-width="2" stroke-linecap="round" stroke="#0EA5E9"/>
    <!-- Bottom pins -->
    <path d="M8 19.6V22.2" stroke-width="2" stroke-linecap="round" stroke="#10B981"/>
    <path d="M12 19.6V22.2" stroke-width="2" stroke-linecap="round" stroke="#10B981"/>
    <path d="M16 19.6V22.2" stroke-width="2" stroke-linecap="round" stroke="#10B981"/>
    <!-- Left pins -->
    <path d="M1.8 8H4.4" stroke-width="2" stroke-linecap="round" stroke="#F43F5E"/>
    <path d="M1.8 12H4.4" stroke-width="2" stroke-linecap="round" stroke="#F43F5E"/>
    <path d="M1.8 16H4.4" stroke-width="2" stroke-linecap="round" stroke="#F43F5E"/>
    <!-- Right pins -->
    <path d="M19.6 8H22.2" stroke-width="2" stroke-linecap="round" stroke="#8B5CF6"/>
    <path d="M19.6 12H22.2" stroke-width="2" stroke-linecap="round" stroke="#8B5CF6"/>
    <path d="M19.6 16H22.2" stroke-width="2" stroke-linecap="round" stroke="#8B5CF6"/>
    <!-- Outer body -->
    <path d="M7.1 4.5H16.9C18.3359 4.5 19.5 5.66406 19.5 7.1V16.9C19.5 18.3359 18.3359 19.5 16.9 19.5H7.1C5.66406 19.5 4.5 18.3359 4.5 16.9V7.1C4.5 5.66406 5.66406 4.5 7.1 4.5Z" stroke-width="2.1" stroke="url(#chip-grad)"/>
    <!-- Inner core -->
    <path d="M10 8.75H14C14.6904 8.75 15.25 9.30964 15.25 10V14C15.25 14.6904 14.6904 15.25 14 15.25H10C9.30964 15.25 8.75 14.6904 8.75 14V10C8.75 9.30964 9.30964 8.75 10 8.75Z" stroke-width="2" stroke="#0F172A"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="250" y="154" text-anchor="middle" class="font-sans" font-size="28" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Вход в AI–buddy</text>
  <text x="250" y="184" text-anchor="middle" class="font-sans" font-size="15" font-weight="400" fill="#64748B">Выберите пользователя для входа</text>

  <!-- Main Card Container -->
  <rect x="30" y="220" width="440" height="330" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />

  <!-- Label: "Пользователь" with Person icon -->
  <g transform="translate(60, 252)">
    <!-- Person Outline Icon -->
    <path d="M6 1C4.34315 1 3 2.34315 3 4C3 5.65685 4.34315 7 6 7C7.65685 7 9 5.65685 9 4C9 2.34315 7.65685 1 6 1Z" stroke="#475569" stroke-width="1.3" fill="none" />
    <path d="M1 12C1 9.5 3 8 6 8C9 8 11 9.5 11 12" stroke="#475569" stroke-width="1.3" stroke-linecap="round" fill="none" />
    <!-- Label Text -->
    <text x="18" y="10" class="font-sans" font-size="12.5" font-weight="600" fill="#475569">Пользователь</text>
  </g>

  <!-- Select / Dropdown Box -->
  <rect x="58" y="274" width="384" height="48" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Inside Select Box -->
  <g transform="translate(58, 274)">
    <!-- Avatar circle -->
    <circle cx="28" cy="24" r="14" fill="#00A3FF" />
    <text x="28" y="29" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#FFFFFF">Д</text>

    <!-- User Name, separator, role -->
    <text x="52" y="29" class="font-sans" font-size="15" font-weight="700" fill="#0F172A">Даша</text>
    <text x="96" y="29" class="font-sans" font-size="14" font-weight="400" fill="#94A3B8">—</text>
    <text x="114" y="29" class="font-sans" font-size="14" font-weight="400" fill="#64748B">стажер</text>

    <!-- Chevron Down Icon -->
    <path d="M352 21L357 26L362 21" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Info Cards: "Роль" and "Команда" -->
  <!-- Left Card: Роль -->
  <g transform="translate(58, 344)">
    <rect width="184" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <!-- Hexagon icon -->
    <circle cx="22" cy="20" r="4.5" stroke="#94A3B8" stroke-width="1.3" fill="none" />
    <text x="33" y="23" class="font-sans" font-size="11.5" font-weight="500" fill="#64748B">Роль</text>
    <text x="15" y="44" class="font-sans" font-size="14" font-weight="700" fill="#0F172A">Стажёр</text>
  </g>

  <!-- Right Card: Команда -->
  <g transform="translate(258, 344)">
    <rect width="184" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <!-- Building/platform icon -->
    <path d="M17 24V17C17 16 18 15 19 15H21C22 15 23 16 23 17V24" stroke="#94A3B8" stroke-width="1.3" fill="none" />
    <path d="M23 19H26C27 19 28 20 28 21V24" stroke="#94A3B8" stroke-width="1.3" fill="none" />
    <path d="M15 24H29" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round" />
    <text x="35" y="23" class="font-sans" font-size="11.5" font-weight="500" fill="#64748B">Команда</text>
    <text x="15" y="44" class="font-sans" font-size="13" font-weight="700" fill="#0F172A">Frontend Platform</text>
  </g>

  <!-- Notice Note -->
  <g transform="translate(60, 424)">
    <!-- Chat message icon -->
    <path d="M1 3C1 1.89543 1.89543 1 3 1H11C12.1046 1 13 1.89543 13 3V8C13 9.10457 12.1046 10 11 10H4L1 13V3Z" stroke="#00A3FF" stroke-width="1.6" stroke-linejoin="round" fill="none" />
    <text x="21" y="9" class="font-sans" font-size="11" font-weight="400" fill="#64748B">Ментор: Катя · Доступ к чату AI-buddy, прогрессу и документам</text>
    <text x="21" y="24" class="font-sans" font-size="11" font-weight="400" fill="#64748B">команды.</text>
  </g>

  <!-- Submit Button: "Войти →" -->
  <g transform="translate(58, 474)">
    <rect width="384" height="46" rx="12" fill="#00A3FF" />
    <text x="192" y="28" text-anchor="middle" class="font-sans" font-size="15" font-weight="600" fill="#FFFFFF">Войти →</text>
  </g>
</svg>